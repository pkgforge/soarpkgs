name: Update Packages

# Resolves the current upstream version of every package and opens a PR with
# the newly pinned version files. The diff is a handful of lines per package,
# which is the point: a silently swapped upstream artifact shows up as a
# changed hash that somebody can actually look at.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      packages:
        description: 'Space-separated package names; empty = all'
        type: string
        default: ''

concurrency:
  group: update-packages
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install sbuild
        run: |
          curl -fsSL "https://github.com/pkgforge/sbuilder/releases/download/nightly/sbuild-$(uname -m)-linux" \
            -o /usr/local/bin/sbuild
          chmod +x /usr/local/bin/sbuild
          sbuild --version

      - name: Resolve upstream versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sbuild resolve . ${{ inputs.packages }}

      # Forges that report no digest leave a pinned URL with no hash. That
      # state must never reach a commit, so fill it before validating. The
      # second pass costs nothing when the first succeeded: anything already
      # hashed is skipped, so a transient 500 is retried rather than shipped
      # as an unverifiable pin.
      - name: Hash artifacts with no reported digest
        run: sbuild hashfill
      - name: Retry artifacts the first pass could not hash
        run: sbuild hashfill

      # A pin the forge could not vouch for may still lack blake3 here, and a
      # release may lack an artifact for a host the package claims. Either way
      # the package cannot serve every supported host, so the whole package is
      # held back: the previous pin keeps working, and the pull request names
      # what is missing instead of merging it.
      - name: Hold back packages that cannot serve every supported host
        run: |
          set -euo pipefail
          git status --porcelain -uall packages \
            | cut -c4- \
            | { grep -E '^packages/[^/]+/[^/]+\.toml$' || true; } \
            | { grep -v '/pkg\.toml$' || true; } > changed.txt
          if [ ! -s changed.txt ]; then
            echo "No version file changes."
            exit 0
          fi
          # Strict and file-scoped: the run judges the new pins alone, so a
          # stale gap in an old pin never holds its package back.
          sbuild validate --strict . --files $(cat changed.txt) > held.log 2>&1 || true
          grep '^  ERROR' held.log > held.txt || true
          if [ ! -s held.txt ]; then
            echo "Every changed pin serves all supported hosts."
            exit 0
          fi
          echo "Holding back packages with incomplete or unverifiable pins:"
          cat held.txt
          sed 's/^  ERROR \([^:]*\):.*/\1/' held.txt \
            | while read -r vf; do
                find packages -name "$vf.toml"
              done \
            | sed 's|^packages/||; s|/.*||' \
            | sort -u \
            | while read -r pkg; do
                git checkout -- "packages/$pkg" 2>/dev/null || true
                git clean -fdq "packages/$pkg"
              done

      # One package failing must not cost the tree a month of updates, which
      # is what a hard failure here does: the step aborts, no pull request is
      # opened, and every other package waits for the next scheduled run.
      # So validate, and keep going when it reports errors.
      - name: Validate
        id: validate
        run: |
          set -uo pipefail
          sbuild validate > validate.log 2>&1 || true
          cat validate.log

      # A package validate rejects is left with a pinned URL and no hash,
      # which is exactly the state a commit must not carry. Reverting the
      # package to its committed state drops the bad pin while leaving the
      # rest of the run's work in place.
      - name: Revert packages that failed validation
        run: |
          set -euo pipefail
          # validate names the offending version file by bare name, with no
          # path and no extension, so locate it to find its package. Stripping
          # a version suffix instead would be wrong: 149 of the tree's version
          # files carry a commit hash or a non-numeric suffix.
          sed -n 's/^  ERROR \([^:]*\):.*/\1/p' validate.log \
            | while read -r vf; do
                find packages -name "$vf.toml"
              done \
            | sed 's|^packages/||; s|/.*||' | sort -u > failed.txt || true
          if [ ! -s failed.txt ]; then
            echo "All packages validated."
            exit 0
          fi
          echo "Reverting packages that failed validation:"
          cat failed.txt
          # A newly pinned version file is untracked, so checkout alone
          # leaves it behind and `git add -A` would commit a URL with no
          # hash. Clean the recipe and the new pins together.
          while read -r pkg; do
            [ -n "$pkg" ] || continue
            git checkout -- "packages/$pkg"
            git clean -fdq "packages/$pkg"
          done < failed.txt

      - name: Summarise changes
        id: diff
        run: |
          set -euo pipefail
          git add -A packages
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          {
            echo "## Package updates"
            echo
            echo '```'
            git diff --cached --stat -- packages | tail -40
            echo '```'
            if [ -s failed.txt ]; then
              echo
              echo "## Packages left unpinned"
              echo
              # Named so the next run can be pointed at them once the
              # upstream breakage is fixed.
              echo '```'
              cat failed.txt
              echo '```'
            fi
            if [ -s held.txt ]; then
              echo
              echo "## Held back for missing artifacts or hashes"
              echo
              echo '```'
              cat held.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write pull request body
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          {
            echo "Automated version bump. Each changed file pins a resolved URL"
            echo "and its hash."
            echo
            echo "Review the hashes: a changed hash on an *unchanged* version means"
            echo "upstream replaced an artifact in place, which is worth"
            echo "investigating before merging."
            echo
            echo "## Package updates"
            echo
            echo '```'
            git diff --cached --stat -- packages | tail -40
            echo '```'
            if [ -s failed.txt ] || [ -s held.txt ]; then
              echo
              echo "## Packages left unpinned"
              echo
              echo "Held back rather than pinned, so no unverifiable or"
              echo "uninstallable entry reaches the tree. Re-run this workflow with"
              echo "them once the upstream gap is fixed."
              echo
              if [ -s held.txt ]; then
                sed 's/^  ERROR \([^:]*\): /- **\1**: /' held.txt
              fi
              if [ -s failed.txt ]; then
                while read -r pkg; do
                  echo "- **$pkg**: failed validation"
                done < failed.txt
              fi
            fi
          } > pr-body.md

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automated/package-updates
          title: 'chore: update pinned package versions'
          commit-message: 'chore: update pinned package versions'
          body-path: pr-body.md
          labels: automated
          delete-branch: true
