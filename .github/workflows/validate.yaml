name: Validate

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install sbuild
        run: |
          curl -fsSL "https://github.com/pkgforge/sbuilder/releases/download/nightly/sbuild-$(uname -m)-linux" \
            -o /usr/local/bin/sbuild
          chmod +x /usr/local/bin/sbuild
          sbuild --version

      # Validates the whole tree, not just changed files. It is cheap (no
      # network, no downloads) and a change to one package can invalidate
      # another, so there is no reason to check a subset.
      - name: Validate tree
        run: sbuild validate

      # Downloading is only worth it for what changed, but for those the
      # archive is the only place a wrong install path shows up.
      - name: Audit changed packages against their archives
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed=$(git diff --diff-filter=ACMR --name-only "${BASE_SHA}...${HEAD_SHA}" \
                     -- 'packages/**' | cut -d/ -f2 | sort -u | tr '\n' ' ')
          if [ -z "$changed" ]; then
            echo "No package changes."
            exit 0
          fi
          echo "Auditing: $changed"
          sbuild audit . $changed

      # Every pinned URL must resolve to the artifact its hash describes.
      # Only checked for changed packages, since it costs a request each.
      - name: Check changed URLs resolve
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          git diff --diff-filter=ACMR --name-only "${BASE_SHA}...${HEAD_SHA}" \
            -- 'packages/**/*.toml' > changed.txt || true
          if [ ! -s changed.txt ]; then
            echo "No package changes."
            exit 0
          fi

          fail=0
          while read -r f; do
            [ -n "$f" ] || continue
            grep -oE 'https?://[^"]+' "$f" | while read -r url; do
              code=$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 60 -I "$url" || echo 000)
              if [ "$code" != "200" ]; then
                echo "::error file=$f::$url returned HTTP $code"
                exit 1
              fi
              echo "  ok  $code  $url"
            done || fail=1
          done < changed.txt
          exit $fail
