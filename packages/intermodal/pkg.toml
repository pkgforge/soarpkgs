[pkg]
name        = "intermodal"
type        = "static"
description = "A user-friendly and featureful command-line BitTorrent metainfo utility"
homepage    = ["https://github.com/casey/intermodal"]
license     = ["CC0-1.0"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["ConsoleOnly", "Utility"]
repology    = ["intermodal"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy     = "github-releases"
repo         = "casey/intermodal"
strip-prefix = "v"

[source]
url     = "https://github.com/casey/intermodal/releases/download/v${version}/imdl-v${version}-${arch}-unknown-linux-musl.tar.gz"

[source.install]
"LICENSE"                     = "LICENSE"
"imdl"                        = "bin/imdl"
"imdl.bash"                   = "share/bash-completion/completions/imdl"
"imdl.fish"                   = "share/fish/vendor_completions.d/imdl.fish"
"imdl-completions.1"          = "share/man/man1/imdl-completions.1"
"imdl-torrent-announce.1"     = "share/man/man1/imdl-torrent-announce.1"
"imdl-torrent-create.1"       = "share/man/man1/imdl-torrent-create.1"
"imdl-torrent-dump.1"         = "share/man/man1/imdl-torrent-dump.1"
"imdl-torrent-from-link.1"    = "share/man/man1/imdl-torrent-from-link.1"
"imdl-torrent-link.1"         = "share/man/man1/imdl-torrent-link.1"
"imdl-torrent-piece-length.1" = "share/man/man1/imdl-torrent-piece-length.1"
"imdl-torrent-show.1"         = "share/man/man1/imdl-torrent-show.1"
"imdl-torrent-stats.1"        = "share/man/man1/imdl-torrent-stats.1"
"imdl-torrent-verify.1"       = "share/man/man1/imdl-torrent-verify.1"
"imdl-torrent.1"              = "share/man/man1/imdl-torrent.1"
"imdl.1"                      = "share/man/man1/imdl.1"
"_imdl"                       = "share/zsh/site-functions/_imdl"
