[pkg]
name        = "broot"
type        = "static"
description = "A new way to see and navigate directory trees"
homepage    = ["https://dystroy.org/broot"]
license     = ["MIT"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["ConsoleOnly", "FileManager", "Utility"]
repology    = ["broot"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy     = "github-releases"
repo         = "Canop/broot"
strip-prefix = "v"

[source]
url     = "https://github.com/Canop/broot/releases/download/v${version}/broot_${version}.zip"

[source.install]
"${arch}-unknown-linux-musl/broot"      = "bin/broot"
"${arch}-unknown-linux-musl/br.bash"    = "share/bash-completion/completions/br"
"${arch}-unknown-linux-musl/broot.bash" = "share/bash-completion/completions/broot"
"${arch}-unknown-linux-musl/br.fish"    = "share/fish/vendor_completions.d/br.fish"
"${arch}-unknown-linux-musl/broot.fish" = "share/fish/vendor_completions.d/broot.fish"
"${arch}-unknown-linux-musl/broot.1"    = "share/man/man1/broot.1"
"${arch}-unknown-linux-musl/_br"        = "share/zsh/site-functions/_br"
"${arch}-unknown-linux-musl/_broot"     = "share/zsh/site-functions/_broot"

[[extra]]
url = "https://raw.githubusercontent.com/Canop/broot/main/LICENSE"
to  = "LICENSE"
verify = false
