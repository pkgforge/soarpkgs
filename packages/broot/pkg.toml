[pkg]
name        = "broot"
type        = "static"
description = "A new way to see and navigate directory trees"
homepage    = ["https://dystroy.org/broot"]
license     = ["MIT"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["ConsoleOnly", "FileManager", "Utility"]
repology    = ["broot"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy     = "github-releases"
repo         = "Canop/broot"
strip-prefix = "v"

[source]
url     = "https://github.com/Canop/broot/releases/download/v${version}/broot_${version}.zip"

[source.install]
"${arch}-unknown-linux-musl/broot" = "bin/broot"
"completion/br.bash"              = "share/bash-completion/completions/br"
"completion/broot.bash"           = "share/bash-completion/completions/broot"
"completion/br.fish"              = "share/fish/vendor_completions.d/br.fish"
"completion/broot.fish"           = "share/fish/vendor_completions.d/broot.fish"
"completion/_br"                  = "share/zsh/site-functions/_br"
"completion/_broot"               = "share/zsh/site-functions/_broot"
"broot.1"                         = "share/man/man1/broot.1"

[[extra]]
url = "https://raw.githubusercontent.com/Canop/broot/main/LICENSE"
to  = "LICENSE"
verify = false
