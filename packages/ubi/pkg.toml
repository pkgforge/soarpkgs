[pkg]
name        = "ubi"
type        = "static"
description = "The universal binary installer"
src         = ["https://github.com/houseabsolute/ubi"]
homepage    = ["https://github.com/houseabsolute/ubi"]
license     = ["Apache-2.0"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["ConsoleOnly", "Development", "Utility"]
repology    = ["ubi"]

[host]
supported = ["x86_64-linux", "aarch64-linux", "riscv64-linux"]

[arch]
aarch64 = "arm64"
x86_64  = "x86_64"

[update]
strategy   = "github-releases"
repo       = "pkgforge/builds"
tag-prefix = "ubi-"

[source]

[source.url]
x86_64-linux  = "https://github.com/houseabsolute/ubi/releases/download/v${version}/ubi-Linux-musl-${arch}.tar.gz"
aarch64-linux = "https://github.com/houseabsolute/ubi/releases/download/v${version}/ubi-Linux-musl-${arch}.tar.gz"
riscv64-linux = "https://github.com/pkgforge/builds/releases/download/ubi-${version}/ubi-${version}-riscv64-linux.tar.gz"

[source.install]
"ubi" = "bin/ubi"

[[extra]]
url = "https://raw.githubusercontent.com/houseabsolute/ubi/master/LICENSE-APACHE"
to  = "LICENSE"
verify = false
