[pkg]
name        = "basiliskii"
type        = "appimage"
description = "Open source 68k Macintosh (Basilisk II) emulator"
homepage    = ["https://github.com/kanjitalk755/macemu"]
license     = ["GPL-2.0-only"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["Emulator", "System"]
repology    = ["basiliskii"]
provides    = ["basiliskii"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/BasiliskII-AppImage-Enhanced"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/BasiliskII-AppImage-Enhanced"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/kanjitalk755/macemu/master/BasiliskII/COPYING"
to  = "LICENSE"
