[pkg]
name        = "openmohaa"
type        = "appimage"
description = "Open re-implementation of Medal of Honor: Allied Assault"
homepage    = [
  "https://docs.openmohaa.org",
  "https://github.com/openmoh/openmohaa",
]
license    = ["GPL-2.0"]
maintainer = ["QaidVoid (contact@qaidvoid.dev)"]
category   = ["Game", "Shooter", "ActionGame"]
repology   = ["openmohaa"]
note       = ["Needs the original Medal of Honor: Allied Assault game data, which is not shipped"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/OpenMoHAA-AppImage"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/OpenMoHAA-AppImage"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/openmoh/openmohaa/main/COPYING.txt"
to  = "LICENSE"
verify = false
