[pkg]
name        = "spacecadetpinball"
type        = "appimage"
description = "3D Pinball for Windows - Space Cadet"
homepage    = ["https://github.com/k4zmu2a/SpaceCadetPinball"]
license     = ["MIT"]
maintainer  = ["Samueru-sama (github.com/Samueru-sama)"]
category    = ["ArcadeGame", "Game"]
repology    = ["spacecadetpinball"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/spacecadetpinball-AppImage"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/spacecadetpinball-AppImage"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/k4zmu2a/SpaceCadetPinball/refs/heads/master/LICENSE"
to  = "LICENSE"
verify = false
