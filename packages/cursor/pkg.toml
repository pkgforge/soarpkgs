[pkg]
name        = "cursor"
type        = "appimage"
description = "The AI-first code editor"
homepage    = [
  "https://www.cursor.com",
  "https://github.com/pkgforge-dev/Cursor-AppImage-enhanced",
]
license    = ["Proprietary"]
maintainer = ["Samueru-sama (github.com/Samueru-sama)"]
category   = ["Development", "IDE", "TextEditor"]
repology   = ["cursor"]
provides   = ["cursor"]
note        = [
  "Terms of service: https://cursor.com/terms-of-service",
]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/Cursor-AppImage-enhanced"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/Cursor-AppImage-enhanced"
glob   = "*${arch}*.appimage"

