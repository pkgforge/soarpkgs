[pkg]
name        = "cubyz"
type        = "appimage"
description = "Voxel sandbox game with large render distance and procedurally generated content"
homepage    = ["https://github.com/PixelGuys/Cubyz"]
license     = ["GPL-3.0"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["Game", "AdventureGame", "3DGraphics"]
repology    = ["cubyz"]
provides    = ["cubyz"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/Cubyz-AppImage"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/Cubyz-AppImage"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/PixelGuys/Cubyz/master/LICENSE"
to  = "LICENSE"
