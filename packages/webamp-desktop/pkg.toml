[pkg]
name        = "webamp-desktop"
type        = "appimage"
description = "Desktop build of the Winamp 2.9 reimplementation Webamp"
homepage    = ["https://github.com/durasj/webamp-desktop"]
license     = ["MIT"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["Audio", "Player", "AudioVideo"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/Webamp-Desktop-AppImage-Enhanced"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/Webamp-Desktop-AppImage-Enhanced"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/durasj/webamp-desktop/master/LICENSE"
to  = "LICENSE"
verify = false
