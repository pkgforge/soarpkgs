[pkg]
name        = "augustus"
type        = "appimage"
description = "An open source re-implementation of Caesar III"
homepage    = ["https://github.com/Keriew/augustus"]
license     = ["AGPL-3.0"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["Game", "StrategyGame"]
provides    = ["augustus"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/Augustus-AppImage-Enhanced"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/Augustus-AppImage-Enhanced"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/Keriew/augustus/master/LICENSE.txt"
to  = "LICENSE"
