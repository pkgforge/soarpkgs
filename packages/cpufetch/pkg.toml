[pkg]
name        = "cpufetch"
type        = "static"
description = "Simple yet fancy CPU architecture fetching tool"
homepage    = ["https://github.com/Dr-Noob/cpufetch"]
license     = ["GPL-2.0"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["System", "Utility"]
repology    = ["cpufetch"]
provides    = ["cpufetch"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[arch]
aarch64 = "arm64"
x86_64  = "x86-64"

[update]
strategy     = "github-releases"
repo         = "Dr-Noob/cpufetch"
strip-prefix = "v"

[source]
url = "https://github.com/Dr-Noob/cpufetch/releases/download/v${version}/cpufetch_${arch}_linux"

[[extra]]
url = "https://raw.githubusercontent.com/Dr-Noob/cpufetch/master/LICENSE"
to  = "LICENSE"
verify = false
