[pkg]
name        = "gopher64"
type        = "appimage"
description = "Highly compatible cross-platform Nintendo 64 emulator written in Rust"
homepage    = ["https://github.com/gopher64/gopher64"]
license     = ["GPL-3.0"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["Emulator", "Game"]
repology    = ["gopher64"]
provides    = ["gopher64"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy     = "github-releases"
repo         = "pkgforge-dev/Gopher64-AppImage"
strip-prefix = "v"
tag-suffix   = "strip"

[source]
github = "pkgforge-dev/Gopher64-AppImage"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/gopher64/gopher64/main/LICENSE"
to  = "LICENSE"
