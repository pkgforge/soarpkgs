[pkg]
name        = "gdu"
type        = "static"
description = "Fast disk usage calculator with console interface"
homepage    = ["https://github.com/dundee/gdu"]
license     = ["MIT"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["ConsoleOnly", "Filesystem", "Utility"]
repology    = ["gdu"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[arch]
aarch64 = "arm64"
x86_64  = "amd64_static"

[update]
strategy     = "github-releases"
repo         = "dundee/gdu"
strip-prefix = "v"

[source]
url     = "https://github.com/dundee/gdu/releases/download/v${version}/gdu_linux_${arch}.tgz"

[source.install]
"gdu_linux_${arch}" = "bin/gdu"

[[extra]]
url = "https://raw.githubusercontent.com/dundee/gdu/master/LICENSE.md"
to  = "LICENSE"
verify = false
