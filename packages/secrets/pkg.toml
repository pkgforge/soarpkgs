[pkg]
name        = "secrets"
type        = "appimage"
description = "Manage your passwords"
homepage    = [
  "https://gitlab.gnome.org/World/secrets",
  "https://github.com/pkgforge-dev/Secrets-AppImage",
]
license    = ["GPL-3.0"]
maintainer = ["fiftydinar (github.com/fiftydinar)"]
category   = ["Security", "Utility"]
repology   = ["secrets"]
provides   = ["secrets"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/Secrets-AppImage"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/Secrets-AppImage"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://gitlab.gnome.org/World/secrets/-/raw/master/LICENSE"
to  = "LICENSE"
