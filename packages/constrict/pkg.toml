[pkg]
name        = "constrict"
type        = "appimage"
description = "Compress videos to target sizes"
homepage    = ["https://gitlab.gnome.org/World/Constrict"]
license     = ["GPL-3.0-or-later"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["Video", "AudioVideo", "Utility"]
repology    = ["constrict"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/Constrict-AppImage"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/Constrict-AppImage"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://gitlab.gnome.org/World/Constrict/-/raw/main/LICENSE"
to  = "LICENSE"
verify = false
