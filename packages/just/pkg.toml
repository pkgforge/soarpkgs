[pkg]
name        = "just"
type        = "static"
description = "A handy way to save and run project-specific commands"
homepage    = ["https://just.systems"]
license     = ["CC0-1.0"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["ConsoleOnly", "Development", "Utility"]
repology    = ["just"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy = "github-releases"
repo     = "casey/just"

[source]
url     = "https://github.com/casey/just/releases/download/${version}/just-${version}-${arch}-unknown-linux-musl.tar.gz"

[source.install]
"LICENSE"   = "LICENSE"
"just"      = "bin/just"
"just.bash" = "share/bash-completion/completions/just"
"just.fish" = "share/fish/vendor_completions.d/just.fish"
"just.1"    = "share/man/man1/just.1"
"just.zsh"  = "share/zsh/site-functions/_just"
