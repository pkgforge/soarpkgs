[pkg]
name        = "tailspin"
type        = "static"
description = "A log file highlighter"
homepage    = ["https://github.com/bensadeh/tailspin"]
license     = ["MIT"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["ConsoleOnly", "Utility"]
repology    = ["tailspin"]
provides    = ["tspin"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy = "github-releases"
repo     = "bensadeh/tailspin"

[source]
url     = "https://github.com/bensadeh/tailspin/releases/download/${version}/tailspin-${arch}-unknown-linux-musl.tar.gz"

[source.install]
"tspin" = "tspin"

[[extra]]
url = "https://raw.githubusercontent.com/bensadeh/tailspin/main/LICENCE"
to  = "LICENSE"
verify = false
