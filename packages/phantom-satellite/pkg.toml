[pkg]
name        = "phantom-satellite"
type        = "appimage"
description = "Pale Moon fork supporting older and niche platforms without dropping modern ones"
homepage    = ["https://github.com/DCFUKSURMOM/Phantom-Satellite"]
license     = ["Custom"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["Network", "WebBrowser"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/Phantom-Satellite-AppImage"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/Phantom-Satellite-AppImage"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/DCFUKSURMOM/Phantom-Satellite/master/LICENSE"
to  = "LICENSE"
verify = false
