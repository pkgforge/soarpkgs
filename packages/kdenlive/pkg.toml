[pkg]
name        = "kdenlive"
type        = "appimage"
description = "Video editor"
homepage    = [
  "https://kdenlive.org",
  "https://github.com/pkgforge-dev/kdenlive-AppImage-Enhanced",
]
license    = ["GPL-3.0"]
maintainer = ["Samueru-sama (github.com/Samueru-sama)"]
category   = ["AudioVideo", "AudioVideoEditing", "Video"]
repology   = ["kdenlive"]
provides   = ["kdenlive"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/kdenlive-AppImage-Enhanced"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/kdenlive-AppImage-Enhanced"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/KDE/kdenlive/refs/heads/master/COPYING"
to  = "LICENSE"
verify = false
