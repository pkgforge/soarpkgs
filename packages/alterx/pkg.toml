[pkg]
name        = "alterx"
type        = "static"
description = "Fast and customizable subdomain wordlist generator using DSL"
homepage    = ["https://github.com/projectdiscovery/alterx"]
license     = ["MIT"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["Network", "Security"]
repology    = ["alterx"]
provides    = ["alterx"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[arch]
aarch64 = "arm64"
x86_64  = "amd64"

[update]
strategy     = "github-releases"
repo         = "projectdiscovery/alterx"
strip-prefix = "v"

[source]
url     = "https://github.com/projectdiscovery/alterx/releases/download/v${version}/alterx_${version}_linux_${arch}.zip"

[source.install]
"alterx"  = "alterx"
"LICENSE" = "LICENSE"
