[pkg]
name        = "opencode-desktop"
type        = "appimage"
description = "AI coding agent desktop client"
homepage    = ["https://github.com/VSCodium/vscodium"]
license     = ["MIT"]
maintainer  = ["Samueru-sama (github.com/Samueru-sama)"]
category    = ["Development", "IDE", "TextEditor"]
repology    = ["opencode-desktop"]

[host]
supported = ["x86_64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/opencode-AppImage-Enhanced"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/opencode-AppImage-Enhanced"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/anomalyco/opencode/refs/heads/dev/LICENSE"
to  = "LICENSE"
verify = false
