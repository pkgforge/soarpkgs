[pkg]
name        = "joplin-desktop"
type        = "appimage"
description = "Privacy-focused note taking app with sync capabilities"
homepage    = [
  "https://joplinapp.org",
  "https://github.com/laurent22/joplin",
]
license    = ["AGPL-3.0"]
maintainer = ["QaidVoid (contact@qaidvoid.dev)"]
category   = ["Office", "Utility"]
repology   = ["joplin"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/Joplin-Desktop-AppImage"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/Joplin-Desktop-AppImage"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/laurent22/joplin/dev/LICENSE"
to  = "LICENSE"
verify = false
