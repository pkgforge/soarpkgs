[pkg]
name        = "ocrmypdf"
type        = "appimage"
description = "Adds an OCR text layer to scanned PDF files, making them searchable"
homepage    = ["https://github.com/ocrmypdf/OCRmyPDF"]
license     = ["MPL-2.0"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["Utility", "Office"]
repology    = ["ocrmypdf"]
provides    = ["ocrmypdf"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/OCRmyPDF-AppImage"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/OCRmyPDF-AppImage"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/ocrmypdf/OCRmyPDF/main/LICENSE"
to  = "LICENSE"
