[pkg]
name        = "sops"
type        = "static"
description = "Simple and flexible tool for managing secrets"
homepage    = ["https://github.com/getsops/sops"]
license     = ["MPL-2.0"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["ConsoleOnly", "Security", "Utility"]
repology    = ["sops"]
provides    = ["sops"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[arch]
aarch64 = "arm64"
x86_64  = "amd64"

[update]
strategy     = "github-releases"
repo         = "getsops/sops"
strip-prefix = "v"

[source]
url = "https://github.com/getsops/sops/releases/download/v${version}/sops-v${version}.linux.${arch}"

[[extra]]
url = "https://raw.githubusercontent.com/getsops/sops/main/LICENSE"
to  = "LICENSE"
verify = false
