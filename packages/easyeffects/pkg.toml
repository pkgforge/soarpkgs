[pkg]
name        = "easyeffects"
type        = "appimage"
description = "Audio effects for PipeWire applications"
homepage    = [ "https://github.com/wwmm/easyeffects" ]
license    = ["GPL-3.0-or-later"]
maintainer = ["QaidVoid (contact@qaidvoid.dev)"]
category   = ["AudioVideo", "Audio"]
repology   = ["easyeffects"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/EasyEffects-AppImage"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/EasyEffects-AppImage"
glob   = "*${arch}*.appimage"
