[pkg]
name        = "abaddon"
type        = "appimage"
description = "Alternative Discord client with voice support made with C++ and GTK 3"
homepage    = ["https://github.com/uowuo/abaddon"]
license     = ["GPL-3.0"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["Chat", "InstantMessaging", "Network"]
repology    = ["abaddon"]
provides    = ["abaddon"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/Abaddon-AppImage"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/Abaddon-AppImage"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/uowuo/abaddon/refs/heads/master/LICENSE"
to  = "LICENSE"
verify = false
