[pkg]
name        = "nxengine-evo"
type        = "appimage"
description = "Refactored and enhanced version of the NXEngine Cave Story game engine"
homepage    = ["https://github.com/nxengine/nxengine-evo"]
license     = ["GPL-3.0"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["Game", "AdventureGame", "ActionGame"]
repology    = ["nxengine-evo"]
provides    = ["nxengine-evo"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/NXEngine-evo-AppImage-Enhanced"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/NXEngine-evo-AppImage-Enhanced"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/nxengine/nxengine-evo/master/LICENSE"
to  = "LICENSE"
verify = false
