[pkg]
name        = "nitrogen"
type        = "appimage"
description = "Background browser and setter for X11 windows"
homepage    = ["https://projects.l3ib.org/nitrogen/", "https://github.com/l3ib/nitrogen"]
license     = ["GPL-2.0"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["Utility", "System"]
repology    = ["nitrogen"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/Nitrogen-AppImage"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/Nitrogen-AppImage"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/l3ib/nitrogen/master/COPYING"
to  = "LICENSE"
verify = false
