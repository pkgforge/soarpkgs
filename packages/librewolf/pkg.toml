[pkg]
name        = "librewolf"
type        = "appimage"
description = "A custom version of Firefox, focused on privacy, security and freedom"
homepage    = ["https://librewolf.net", "https://codeberg.org/librewolf"]
src         = ["https://codeberg.org/librewolf/source"]
license     = ["MPL-2.0"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["WebBrowser", "Network"]
repology    = ["librewolf"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/LibreWolf-AppImage-Enhanced"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/LibreWolf-AppImage-Enhanced"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://gitlab.com/librewolf-community/browser/source/-/raw/main/LICENSE"
to  = "LICENSE"
verify = false
