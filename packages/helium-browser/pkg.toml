[pkg]
name        = "helium-browser"
type        = "appimage"
description = "Private browser based on Chromium with built-in ad blocking"
homepage    = ["https://github.com/imputnet/helium-linux"]
license     = ["GPL-3.0"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["Network", "WebBrowser"]
repology    = ["helium-browser"]
provides    = ["helium-browser"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/Helium-Browser-AppImage-Enhanced"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/Helium-Browser-AppImage-Enhanced"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/imputnet/helium-linux/main/LICENSE"
to  = "LICENSE"
