[pkg]
name        = "snes9x"
type        = "appimage"
description = "Portable Super Nintendo Entertainment System (SNES) emulator"
homepage    = ["http://www.snes9x.com", "https://github.com/snes9xgit/snes9x"]
license     = ["Custom"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["Emulator", "Game"]
repology    = ["snes9x"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/Snes9x-AppImage-Enhanced"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/Snes9x-AppImage-Enhanced"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/snes9xgit/snes9x/master/LICENSE"
to  = "LICENSE"
verify = false
