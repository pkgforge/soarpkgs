[pkg]
name        = "watchexec"
type        = "static"
description = "Executes commands in response to file modifications"
homepage    = ["https://watchexec.github.io"]
license     = ["Apache-2.0"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["ConsoleOnly", "Development", "Utility"]
repology    = ["watchexec"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy     = "github-releases"
repo         = "watchexec/watchexec"
strip-prefix = "v"

[source]
url     = "https://github.com/watchexec/watchexec/releases/download/v${version}/watchexec-${version}-${arch}-unknown-linux-musl.tar.xz"

[source.install]
"watchexec-${version}-${arch}-unknown-linux-musl/LICENSE"          = "LICENSE"
"watchexec-${version}-${arch}-unknown-linux-musl/watchexec"        = "bin/watchexec"
"watchexec-${version}-${arch}-unknown-linux-musl/completions/bash" = "share/bash-completion/completions/watchexec"
"watchexec-${version}-${arch}-unknown-linux-musl/completions/fish" = "share/fish/vendor_completions.d/watchexec.fish"
"watchexec-${version}-${arch}-unknown-linux-musl/watchexec.1"      = "share/man/man1/watchexec.1"
"watchexec-${version}-${arch}-unknown-linux-musl/completions/zsh"  = "share/zsh/site-functions/_watchexec"
