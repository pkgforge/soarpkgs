[pkg]
name        = "firefox"
type        = "appimage"
description = "Mozilla Firefox web browser"
homepage    = [
  "https://www.mozilla.org/firefox",
  "https://github.com/pkgforge-dev/Firefox-AppImage",
]
license    = ["MPL-2.0"]
maintainer = ["QaidVoid (contact@qaidvoid.dev)"]
category   = ["Network", "WebBrowser"]
repology   = ["firefox"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/Firefox-AppImage"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/Firefox-AppImage"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/mozilla-firefox/firefox/main/LICENSE"
to  = "LICENSE"
verify = false
