[pkg]
name        = "usql"
type        = "static"
description = "Universal command-line interface for SQL databases"
homepage    = ["https://github.com/xo/usql"]
license     = ["MIT"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["ConsoleOnly", "Database", "Utility"]
repology    = ["usql-cli"]
provides    = ["usql"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[arch]
aarch64 = "arm64"
x86_64  = "amd64"

[update]
strategy     = "github-releases"
repo         = "xo/usql"
strip-prefix = "v"

[source]
url     = "https://github.com/xo/usql/releases/download/v${version}/usql_static-${version}-linux-${arch}.tar.bz2"

[source.install]
"usql_static" = "usql"
"LICENSE"     = "LICENSE"
