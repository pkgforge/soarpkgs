[pkg]
name        = "bandwhich"
type        = "static"
description = "Terminal bandwidth utilization tool"
homepage    = ["https://github.com/imsnif/bandwhich"]
license     = ["MIT"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["ConsoleOnly", "Monitor", "Network"]
repology    = ["bandwhich"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy     = "github-releases"
repo         = "imsnif/bandwhich"
strip-prefix = "v"

[source]
url     = "https://github.com/imsnif/bandwhich/releases/download/v${version}/bandwhich-v${version}-${arch}-unknown-linux-musl.tar.gz"

[source.install]
"bandwhich"             = "bin/bandwhich"
"assets/bandwhich.1"    = "share/man/man1/bandwhich.1"
"assets/bandwhich.bash" = "share/bash-completion/completions/bandwhich"
"assets/bandwhich.fish" = "share/fish/vendor_completions.d/bandwhich.fish"
"assets/_bandwhich"     = "share/zsh/site-functions/_bandwhich"

[[extra]]
url = "https://raw.githubusercontent.com/imsnif/bandwhich/main/LICENSE.md"
to  = "LICENSE"
verify = false
