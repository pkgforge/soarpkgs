[pkg]
name        = "xh"
type        = "static"
description = "Friendly and fast tool for sending HTTP requests"
homepage    = ["https://github.com/ducaale/xh"]
license     = ["MIT"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["ConsoleOnly", "Network", "Utility"]
repology    = ["xh"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy     = "github-releases"
repo         = "ducaale/xh"
strip-prefix = "v"

[source]
url     = "https://github.com/ducaale/xh/releases/download/v${version}/xh-v${version}-${arch}-unknown-linux-musl.tar.gz"

[source.install]
"xh-v${version}-${arch}-unknown-linux-musl/LICENSE"             = "LICENSE"
"xh-v${version}-${arch}-unknown-linux-musl/xh"                  = "bin/xh"
"xh-v${version}-${arch}-unknown-linux-musl/completions/xh.bash" = "share/bash-completion/completions/xh"
"xh-v${version}-${arch}-unknown-linux-musl/completions/xh.fish" = "share/fish/vendor_completions.d/xh.fish"
"xh-v${version}-${arch}-unknown-linux-musl/doc/xh.1"            = "share/man/man1/xh.1"
"xh-v${version}-${arch}-unknown-linux-musl/completions/_xh"     = "share/zsh/site-functions/_xh"
