[pkg]
name        = "dosbox-pure-unleashed"
type        = "appimage"
description = "DOSBox reimagined, with a friendly interface, ZIP loading and save states"
homepage    = ["https://github.com/schellingb/dosbox-pure-unleashed"]
license     = ["GPL-2.0"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["Emulator", "Game"]
repology    = ["dosbox-pure-unleashed"]
provides    = ["dosbox-pure-unleashed"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/DOSBox-Pure-Unleashed-AppImage"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/DOSBox-Pure-Unleashed-AppImage"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/schellingb/dosbox-pure-unleashed/main/LICENSE"
to  = "LICENSE"
