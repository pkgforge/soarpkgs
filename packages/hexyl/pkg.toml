[pkg]
name        = "hexyl"
type        = "static"
description = "A command-line hex viewer"
homepage    = ["https://github.com/sharkdp/hexyl"]
license     = ["Apache-2.0", "MIT"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["ConsoleOnly", "Utility"]
repology    = ["hexyl"]

[host]
supported = ["x86_64-linux"]

[update]
strategy     = "github-releases"
repo         = "sharkdp/hexyl"
strip-prefix = "v"

[source]
url     = "https://github.com/sharkdp/hexyl/releases/download/v${version}/hexyl-v${version}-${arch}-unknown-linux-musl.tar.gz"

[source.install]
"hexyl-v${version}-${arch}-unknown-linux-musl/LICENSE-APACHE" = "LICENSE-APACHE"
"hexyl-v${version}-${arch}-unknown-linux-musl/LICENSE-MIT"    = "LICENSE-MIT"
"hexyl-v${version}-${arch}-unknown-linux-musl/hexyl"          = "bin/hexyl"
"hexyl-v${version}-${arch}-unknown-linux-musl/hexyl.1"        = "share/man/man1/hexyl.1"
