[pkg]
name        = "gearsystem"
type        = "appimage"
description = "Sega Master System, Game Gear and SG-1000 emulator with debugger"
homepage    = ["https://github.com/drhelius/Gearsystem"]
license     = ["GPL-3.0"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["Emulator", "Game"]
repology    = ["gearsystem"]
provides    = ["gearsystem"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/Gearsystem-AppImage"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/Gearsystem-AppImage"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/drhelius/Gearsystem/master/LICENSE"
to  = "LICENSE"
verify = false
