[pkg]
name        = "fabother-world"
type        = "appimage"
description = "An interpreter for Another World (Out of this World)"
homepage    = ["https://github.com/fabiensanglard/Another-World-Bytecode-Interpreter"]
license     = ["GPL-2.0-only"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["Game", "AdventureGame"]
repology    = ["fabother-world"]
provides    = ["fabother-world"]
channel     = "unstable"

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/Fabother-World-AppImage"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/Fabother-World-AppImage"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/fabiensanglard/Another-World-Bytecode-Interpreter/master/LICENSE.txt"
to  = "LICENSE"
