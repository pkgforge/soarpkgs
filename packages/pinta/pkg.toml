[pkg]
name        = "pinta"
type        = "appimage"
description = "Simple drawing and image editing program"
homepage    = [
  "https://www.pinta-project.com",
  "https://github.com/pkgforge-dev/Pinta-AppImage",
]
license    = ["MIT"]
maintainer = ["Samueru-sama (github.com/Samueru-sama)"]
category   = ["Graphics", "RasterGraphics"]
repology   = ["pinta"]
provides   = ["pinta"]

[host]
supported = ["x86_64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/Pinta-AppImage"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/Pinta-AppImage"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/PintaProject/Pinta/refs/heads/master/license-mit.txt"
to  = "LICENSE"
