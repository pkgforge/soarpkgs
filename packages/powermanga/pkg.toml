[pkg]
name        = "powermanga"
type        = "appimage"
description = "Arcade vertical shoot 'em up with many weapons and power-ups"
homepage    = [
  "https://linux.tlk.fr/games/Powermanga",
  "https://github.com/brunonymous/Powermanga",
]
license    = ["GPL-3.0"]
maintainer = ["QaidVoid (contact@qaidvoid.dev)"]
category   = ["Game", "ArcadeGame"]
repology   = ["powermanga"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/Powermanga-AppImage"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/Powermanga-AppImage"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/brunonymous/Powermanga/master/COPYING"
to  = "LICENSE"
verify = false
