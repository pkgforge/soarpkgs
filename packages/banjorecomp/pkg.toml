[pkg]
name        = "banjorecomp"
type        = "appimage"
description = "PC port of Banjo-Kazooie built with N64: Recompiled"
homepage    = ["https://github.com/BanjoRecomp/BanjoRecomp"]
license     = ["GPL-3.0-only"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["Game", "AdventureGame"]
repology    = ["banjorecomp"]
provides    = ["banjorecomp"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/BanjoRecomp-AppImage"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/BanjoRecomp-AppImage"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/BanjoRecomp/BanjoRecomp/main/COPYING"
to  = "LICENSE"
verify = false
