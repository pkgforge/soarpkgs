[pkg]
name        = "pcsx-redux"
type        = "appimage"
description = "PlayStation 1 emulator and debugger focused on development"
homepage    = ["https://github.com/grumpycoders/pcsx-redux"]
license     = ["GPL-2.0"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["Emulator", "Game"]
repology    = ["pcsx-redux"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/PCSX-Redux-AppImage-Enhanced"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/PCSX-Redux-AppImage-Enhanced"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/grumpycoders/pcsx-redux/refs/heads/main/LICENSE"
to  = "LICENSE"
verify = false
