[pkg]
name        = "xemu"
type        = "appimage"
description = "Original Xbox emulator for Windows, macOS, and Linux"
homepage    = ["https://xemu.app", "https://github.com/xemu-project/xemu"]
license     = ["GPL-2.0"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["Emulator", "Game"]
repology    = ["xemu"]
provides    = ["xemu"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/xemu-AppImage-Enhanced"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/xemu-AppImage-Enhanced"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/xemu-project/xemu/master/COPYING"
to  = "LICENSE"
