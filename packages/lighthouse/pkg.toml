[pkg]
name        = "lighthouse"
type        = "appimage"
description = "PC port of Banjo-Kazooie by Harbour Masters"
homepage    = [
  "https://www.harbourmasters.org",
  "https://github.com/HarbourMasters/Lighthouse",
]
license    = ["CC0-1.0"]
maintainer = ["QaidVoid (contact@qaidvoid.dev)"]
category   = ["Game", "AdventureGame"]
note       = ["Needs an original Banjo-Kazooie ROM, which is not shipped"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/Lighthouse-AppImage-Enhanced"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/Lighthouse-AppImage-Enhanced"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/HarbourMasters/Lighthouse/develop/LICENSE.md"
to  = "LICENSE"
verify = false
