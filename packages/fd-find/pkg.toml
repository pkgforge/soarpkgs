[pkg]
name        = "fd"
type        = "static"
description = "A simple, fast and user-friendly alternative to find"
homepage    = ["https://github.com/sharkdp/fd"]
license     = ["Apache-2.0", "MIT"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["ConsoleOnly", "FileTools", "Utility"]
repology    = ["fd-find"]
provides    = ["fd"]
family      = "fd-find"

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy     = "github-releases"
repo         = "sharkdp/fd"
strip-prefix = "v"

[source]
url     = "https://github.com/sharkdp/fd/releases/download/v${version}/fd-v${version}-${arch}-unknown-linux-musl.tar.gz"

[source.install]
"fd-v${version}-${arch}-unknown-linux-musl/fd"             = "fd"
"fd-v${version}-${arch}-unknown-linux-musl/LICENSE-APACHE" = "LICENSE"
