[pkg]
name        = "lnav"
type        = "static"
description = "Log file navigator"
homepage    = ["https://lnav.org"]
license     = ["BSD-2-Clause"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["ConsoleOnly", "Monitor", "Utility"]
repology    = ["lnav"]
provides    = ["lnav"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[arch]
aarch64 = "arm64"
x86_64  = "x86_64"

[update]
strategy     = "github-releases"
repo         = "tstack/lnav"
strip-prefix = "v"

[source]
url     = "https://github.com/tstack/lnav/releases/download/v${version}/lnav-${version}-linux-musl-${arch}.zip"

[source.install]
"lnav-${version}/lnav" = "lnav"

[[extra]]
url = "https://raw.githubusercontent.com/tstack/lnav/master/LICENSE"
to  = "LICENSE"
