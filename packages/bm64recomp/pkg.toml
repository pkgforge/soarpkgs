[pkg]
name        = "bm64recomp"
type        = "appimage"
description = "Static recompilation of the Nintendo 64 game Bomberman 64"
homepage    = ["https://github.com/RevoSucks/BM64Recomp"]
license     = ["GPL-3.0"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["Game", "ActionGame"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/BM64Recomp-AppImage-Enhanced"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/BM64Recomp-AppImage-Enhanced"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/RevoSucks/BM64Recomp/master/LICENSE.txt"
to  = "LICENSE"
verify = false
