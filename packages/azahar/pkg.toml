[pkg]
name        = "azahar"
type        = "appimage"
description = "Nintendo 3DS emulator"
homepage    = ["https://github.com/azahar-emu/azahar"]
license     = ["GPL-3.0"]
maintainer  = ["Samueru-sama (github.com/Samueru-sama)"]
category    = ["Emulator", "Game"]
repology    = ["azahar"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/Azahar-AppImage-Enhanced"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/Azahar-AppImage-Enhanced"
glob   = "*${arch}*.appimage"
