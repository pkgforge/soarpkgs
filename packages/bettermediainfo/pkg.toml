[pkg]
name        = "bettermediainfo"
type        = "appimage"
description = "A better GUI for MediaInfo media file metadata inspection"
homepage    = ["https://github.com/caoccao/BetterMediaInfo"]
license     = ["Apache-2.0"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["Utility", "AudioVideo", "Video"]
provides    = ["bettermediainfo"]

[host]
supported = ["x86_64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/BetterMediaInfo-AppImage-Enhanced"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/BetterMediaInfo-AppImage-Enhanced"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/caoccao/BetterMediaInfo/main/LICENSE"
to  = "LICENSE"
verify = false
