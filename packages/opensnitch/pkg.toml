[pkg]
name        = "opensnitch"
type        = "appimage"
description = "Interactive application firewall inspired by Little Snitch"
homepage    = [
  "https://github.com/evilsocket/opensnitch",
  "https://github.com/pkgforge-dev/OpenSnitch-AppImage",
]
license    = ["GPL-3.0"]
maintainer = ["QaidVoid (contact@qaidvoid.dev)"]
category   = ["Network", "Security", "System"]
repology   = ["opensnitch"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/OpenSnitch-AppImage"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/OpenSnitch-AppImage"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/evilsocket/opensnitch/master/LICENSE"
to  = "LICENSE"
verify = false
