[pkg]
name        = "sirikali"
type        = "appimage"
description = "Qt GUI front end to sshfs, cryfs, gocryptfs, securefs, fscrypt and encfs"
homepage    = [
  "https://mhogomchungu.github.io/sirikali",
  "https://github.com/mhogomchungu/sirikali",
]
license    = ["GPL-3.0-or-later"]
maintainer = ["QaidVoid (contact@qaidvoid.dev)"]
category   = ["Utility", "Security", "System"]
repology   = ["sirikali"]
provides   = ["sirikali"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/SiriKali-AppImage"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/SiriKali-AppImage"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/mhogomchungu/sirikali/master/LICENSE"
to  = "LICENSE"
