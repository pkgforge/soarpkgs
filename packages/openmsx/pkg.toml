[pkg]
name        = "openmsx"
type        = "appimage"
description = "MSX home computer emulator that aims for perfection"
homepage    = ["https://openmsx.org", "https://github.com/openMSX/openMSX"]
license     = ["GPL-2.0"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["Emulator", "Game"]
repology    = ["openmsx"]
provides    = ["openmsx"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/openMSX-AppImage"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/openMSX-AppImage"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/openMSX/openMSX/master/doc/GPL.txt"
to  = "LICENSE"
