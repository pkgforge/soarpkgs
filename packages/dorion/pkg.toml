[pkg]
name        = "dorion"
type        = "appimage"
description = "Tiny alternative Discord client with smaller footprint, snappier startup and themes"
homepage    = ["https://github.com/SpikeHD/Dorion"]
license     = ["GPL-3.0-only"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["Network", "InstantMessaging", "Chat"]
repology    = ["dorion"]
provides    = ["dorion"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/Dorion-AppImage-Enhanced"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/Dorion-AppImage-Enhanced"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/SpikeHD/Dorion/main/LICENSE"
to  = "LICENSE"
verify = false
