[pkg]
name        = "readest"
type        = "appimage"
description = "Modern, feature-rich ebook reader for avid readers"
homepage    = ["https://readest.com", "https://github.com/readest/readest"]
license     = ["AGPL-3.0"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["Office", "Viewer", "Utility"]
repology    = ["readest"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/Readest-AppImage-Enhanced"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/Readest-AppImage-Enhanced"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/readest/readest/main/LICENSE"
to  = "LICENSE"
verify = false
