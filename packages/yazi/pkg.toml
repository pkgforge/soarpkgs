[pkg]
name        = "yazi"
type        = "static"
description = "Blazing fast terminal file manager written in Rust, based on async I/O"
homepage    = ["https://yazi-rs.github.io"]
license     = ["MIT"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["ConsoleOnly", "FileManager", "Utility"]
repology    = ["yazi"]
provides    = ["yazi", "@ya"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy     = "github-releases"
repo         = "sxyazi/yazi"
strip-prefix = "v"

[source]
url     = "https://github.com/sxyazi/yazi/releases/download/v${version}/yazi-${arch}-unknown-linux-musl.zip"

[source.install]
"yazi-${arch}-unknown-linux-musl/yazi"    = "yazi"
"yazi-${arch}-unknown-linux-musl/ya"      = "ya"
"yazi-${arch}-unknown-linux-musl/LICENSE" = "LICENSE"
