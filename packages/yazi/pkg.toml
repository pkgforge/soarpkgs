[pkg]
name        = "yazi"
type        = "static"
description = "Blazing fast terminal file manager written in Rust, based on async I/O"
homepage    = ["https://yazi-rs.github.io"]
license     = ["MIT"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["ConsoleOnly", "FileManager", "Utility"]
repology    = ["yazi"]

[host]
supported = ["x86_64-linux", "aarch64-linux", "riscv64-linux"]

[update]
strategy     = "github-releases"
repo         = "sxyazi/yazi"
strip-prefix = "v"

[source]

[source.url]
x86_64-linux  = "https://github.com/sxyazi/yazi/releases/download/v${version}/yazi-${arch}-unknown-linux-musl.zip"
aarch64-linux = "https://github.com/sxyazi/yazi/releases/download/v${version}/yazi-${arch}-unknown-linux-musl.zip"
riscv64-linux = "https://github.com/pkgforge/builds/releases/download/yazi-${version}/yazi-${version}-riscv64-linux.tar.gz"

[source.install]
"yazi-${arch}-unknown-linux-musl/LICENSE"               = "LICENSE"
"yazi-${arch}-unknown-linux-musl/ya"                    = "bin/ya"
"yazi-${arch}-unknown-linux-musl/yazi"                  = "bin/yazi"
"yazi-${arch}-unknown-linux-musl/completions/ya.bash"   = "share/bash-completion/completions/ya"
"yazi-${arch}-unknown-linux-musl/completions/yazi.bash" = "share/bash-completion/completions/yazi"
"yazi-${arch}-unknown-linux-musl/completions/ya.fish"   = "share/fish/vendor_completions.d/ya.fish"
"yazi-${arch}-unknown-linux-musl/completions/yazi.fish" = "share/fish/vendor_completions.d/yazi.fish"
"yazi-${arch}-unknown-linux-musl/completions/_ya"       = "share/zsh/site-functions/_ya"
"yazi-${arch}-unknown-linux-musl/completions/_yazi"     = "share/zsh/site-functions/_yazi"

[source.install.riscv64-linux]
"yazi"    = "bin/yazi"
"ya"      = "bin/ya"
"LICENSE" = "LICENSE"
