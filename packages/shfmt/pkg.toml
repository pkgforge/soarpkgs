[pkg]
name        = "shfmt"
type        = "static"
description = "Shell parser, formatter, and interpreter with bash support"
homepage    = ["https://github.com/mvdan/sh"]
license     = ["BSD-3-Clause"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["ConsoleOnly", "Development", "Utility"]
repology    = ["shfmt"]
provides    = ["shfmt"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[arch]
aarch64 = "arm64"
x86_64  = "amd64"

[update]
strategy     = "github-releases"
repo         = "mvdan/sh"
strip-prefix = "v"

[source]
url = "https://github.com/mvdan/sh/releases/download/v${version}/shfmt_v${version}_linux_${arch}"

[[extra]]
url = "https://raw.githubusercontent.com/mvdan/sh/master/LICENSE"
to  = "LICENSE"
verify = false
