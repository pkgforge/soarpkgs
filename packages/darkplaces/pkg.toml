[pkg]
name        = "darkplaces"
type        = "appimage"
description = "Modernized Quake game engine with advanced graphics and rendering"
homepage    = [
  "https://icculus.org/twilight/darkplaces/",
  "https://github.com/DarkPlacesEngine/DarkPlaces",
]
license    = ["GPL-2.0"]
maintainer = ["QaidVoid (contact@qaidvoid.dev)"]
category   = ["Game", "ActionGame"]
repology   = ["darkplaces"]
provides   = ["darkplaces"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/DarkPlaces-AppImage"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/DarkPlaces-AppImage"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/DarkPlacesEngine/DarkPlaces/master/COPYING"
to  = "LICENSE"
