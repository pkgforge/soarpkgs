[pkg]
name        = "mousai"
type        = "appimage"
description = "Identify songs in seconds"
homepage    = ["https://github.com/SeaDve/Mousai"]
license     = ["GPL-3.0"]
maintainer  = ["fiftydinar (github.com/fiftydinar)"]
category    = ["Audio", "Music"]
repology    = ["mousai"]
provides    = ["mousai"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/Mousai-AppImage"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/Mousai-AppImage"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/SeaDve/Mousai/refs/heads/main/COPYING"
to  = "LICENSE"
