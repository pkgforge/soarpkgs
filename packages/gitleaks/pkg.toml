[pkg]
name        = "gitleaks"
type        = "static"
description = "Find secrets with Gitleaks"
homepage    = ["https://github.com/gitleaks/gitleaks"]
license     = ["MIT"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["ConsoleOnly", "Security", "Development"]
repology    = ["gitleaks"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[arch]
aarch64 = "arm64"
x86_64  = "x64"

[update]
strategy     = "github-releases"
repo         = "gitleaks/gitleaks"
strip-prefix = "v"

[source]
url     = "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_${arch}.tar.gz"

[source.install]
"LICENSE"  = "LICENSE"
"gitleaks" = "bin/gitleaks"
