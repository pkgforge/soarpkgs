[pkg]
name        = "pueue"
type        = "static"
description = "Manage your shell commands with a task queue"
homepage    = ["https://github.com/Nukesor/pueue"]
license     = ["MIT"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["ConsoleOnly", "System", "Utility"]
repology    = ["pueue"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy     = "github-releases"
repo         = "Nukesor/pueue"
strip-prefix = "v"

[source]
url = "https://github.com/Nukesor/pueue/releases/download/v${version}/pueue-${arch}-unknown-linux-musl"

[[source.install]]
to   = "bin/pueue"
symlink_as = ["pueued"]

[[extra]]
url = "https://raw.githubusercontent.com/Nukesor/pueue/main/LICENSE.MIT"
to  = "LICENSE"
verify = false

[[extra]]
url = "https://github.com/Nukesor/pueue/releases/download/v${version}/pueued-${arch}-unknown-linux-musl"
to  = "pueued"
