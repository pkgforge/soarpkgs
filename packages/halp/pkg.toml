[pkg]
name        = "halp"
type        = "static"
description = "A CLI tool to get help with CLI tools"
homepage    = ["https://github.com/orhun/halp"]
license     = ["Apache-2.0"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["ConsoleOnly", "Utility"]
repology    = ["halp"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy     = "github-releases"
repo         = "orhun/halp"
strip-prefix = "v"

[source]
url     = "https://github.com/orhun/halp/releases/download/v${version}/halp-${version}-${arch}-unknown-linux-musl.tar.gz"

[source.install]
"halp-${version}/LICENSE-MIT"           = "LICENSE-MIT"
"halp-${version}/LICENSE-APACHE"        = "LICENSE-APACHE"
"halp-${version}/halp"                  = "bin/halp"
"halp-${version}/completions/halp.bash" = "share/bash-completion/completions/halp"
"halp-${version}/completions/halp.fish" = "share/fish/vendor_completions.d/halp.fish"
"halp-${version}/man/halp.1"            = "share/man/man1/halp.1"
"halp-${version}/completions/_halp"     = "share/zsh/site-functions/_halp"
