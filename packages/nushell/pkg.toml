[pkg]
name        = "nushell"
type        = "static"
description = "A new type of shell"
homepage    = ["https://www.nushell.sh"]
license     = ["MIT"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["ConsoleOnly", "System", "Utility"]
repology    = ["nushell"]
provides    = ["nu"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy = "github-releases"
repo     = "nushell/nushell"

[source]
url     = "https://github.com/nushell/nushell/releases/download/${version}/nu-${version}-${arch}-unknown-linux-musl.tar.gz"

[source.install]
"nu-${version}-${arch}-unknown-linux-musl/nu"      = "nu"
"nu-${version}-${arch}-unknown-linux-musl/LICENSE" = "LICENSE"
