[pkg]
name        = "desmume"
type        = "appimage"
description = "Nintendo DS emulator"
homepage    = ["https://desmume.org", "https://github.com/pkgforge-dev/DeSmuME-AppImage"]
license     = ["GPL-2.0"]
maintainer  = ["Samueru-sama (github.com/Samueru-sama)"]
category    = ["Emulator", "Game"]
repology    = ["desmume"]
provides    = ["desmume"]

[host]
supported = ["x86_64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/DeSmuME-AppImage"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/DeSmuME-AppImage"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/TASEmulators/desmume/refs/heads/master/license.txt"
to  = "LICENSE"
