[pkg]
name        = "tlrc"
type        = "static"
description = "A tldr client written in Rust"
homepage    = ["https://github.com/tldr-pages/tlrc"]
license     = ["MIT"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["ConsoleOnly", "Utility"]
repology    = ["tlrc"]

[host]
supported = ["x86_64-linux"]

[update]
strategy     = "github-releases"
repo         = "tldr-pages/tlrc"
strip-prefix = "v"

[source]
url     = "https://github.com/tldr-pages/tlrc/releases/download/v${version}/tlrc-v${version}-${arch}-unknown-linux-musl.tar.gz"

[source.install]
"LICENSE"   = "LICENSE"
"tldr"      = "bin/tldr"
"tldr.bash" = "share/bash-completion/completions/tldr"
"tldr.fish" = "share/fish/vendor_completions.d/tldr.fish"
"tldr.1"    = "share/man/man1/tldr.1"
"_tldr"     = "share/zsh/site-functions/_tldr"
