[pkg]
name        = "bore"
type        = "static"
description = "A command line tool for making tunnels to localhost"
homepage    = ["https://github.com/ekzhang/bore"]
license     = ["MIT"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["Network", "Utility"]
repology    = ["bore-cli"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy     = "github-releases"
repo         = "ekzhang/bore"
strip-prefix = "v"

[source]
github  = "ekzhang/bore"
glob    = "*${arch}-unknown-linux-musl.tar.gz"

[source.install]
"bore" = "bin/bore"

[[extra]]
url = "https://raw.githubusercontent.com/ekzhang/bore/master/LICENSE"
to  = "LICENSE"
verify = false
