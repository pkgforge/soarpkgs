[pkg]
name        = "supermodel"
type        = "appimage"
description = "Official Sega Model 3 arcade machine emulator"
homepage    = ["https://supermodel3.com", "https://github.com/trzy/Supermodel"]
license     = ["GPL-3.0"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["Emulator", "Game"]
repology    = ["supermodel"]
provides    = ["supermodel"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/Supermodel-AppImage"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/Supermodel-AppImage"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/trzy/Supermodel/master/Docs/LICENSE.txt"
to  = "LICENSE"
