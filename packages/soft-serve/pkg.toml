[pkg]
name        = "soft-serve"
type        = "static"
description = "The mighty, self-hostable Git server for the command line"
homepage    = ["https://github.com/charmbracelet/soft-serve"]
license     = ["MIT"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["ConsoleOnly", "Development", "Network"]
repology    = ["soft-serve"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[arch]
aarch64 = "arm64"
x86_64  = "x86_64"

[update]
strategy     = "github-releases"
repo         = "charmbracelet/soft-serve"
strip-prefix = "v"

[source]
url     = "https://github.com/charmbracelet/soft-serve/releases/download/v${version}/soft-serve_${version}_Linux_${arch}.tar.gz"

[source.install]
"soft-serve_${version}_Linux_${arch}/LICENSE"                     = "LICENSE"
"soft-serve_${version}_Linux_${arch}/soft"                        = "bin/soft"
"soft-serve_${version}_Linux_${arch}/completions/soft-serve.bash" = "share/bash-completion/completions/soft-serve"
"soft-serve_${version}_Linux_${arch}/completions/soft-serve.fish" = "share/fish/vendor_completions.d/soft-serve.fish"
"soft-serve_${version}_Linux_x86_64/manpages/soft-serve.1.gz"     = "share/man/man1/soft-serve.1.gz"
"soft-serve_${version}_Linux_${arch}/completions/soft-serve.zsh"  = "share/zsh/site-functions/_soft-serve"
