[pkg]
name        = "redriver2"
type        = "appimage"
description = "Reverse-engineered port of the PSX game Driver 2"
homepage    = ["https://github.com/OpenDriver2/REDRIVER2"]
license     = ["MIT"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["Game", "ActionGame", "ArcadeGame"]

[host]
supported = ["x86_64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/REDRIVER2-AppImage"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/REDRIVER2-AppImage"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/OpenDriver2/REDRIVER2/master/LICENSE"
to  = "LICENSE"
verify = false
