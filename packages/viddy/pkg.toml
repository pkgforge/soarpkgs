[pkg]
name        = "viddy"
type        = "static"
description = "A modern watch command"
homepage    = ["https://github.com/sachaos/viddy"]
license     = ["MIT"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["ConsoleOnly", "Utility"]
repology    = ["viddy"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[arch]
aarch64 = "arm64"
x86_64  = "x86_64"

[update]
strategy     = "github-releases"
repo         = "sachaos/viddy"
strip-prefix = "v"

[source]
url     = "https://github.com/sachaos/viddy/releases/download/v${version}/viddy-v${version}-linux-${arch}.tar.gz"

[source.install]
"viddy" = "bin/viddy"

[[extra]]
url = "https://raw.githubusercontent.com/sachaos/viddy/master/LICENSE"
to  = "LICENSE"
verify = false
