[pkg]
name        = "librecad"
type        = "appimage"
description = "2D CAD application"
homepage    = [
  "https://librecad.org",
  "https://github.com/pkgforge-dev/LibreCAD-AppImage",
]
license    = ["GPL-2.0"]
maintainer = ["Samueru-sama (github.com/Samueru-sama)"]
category   = ["Construction", "Graphics"]
repology   = ["librecad"]
provides   = ["librecad"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/LibreCAD-AppImage"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/LibreCAD-AppImage"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/LibreCAD/LibreCAD/refs/heads/master/LICENSE"
to  = "LICENSE"
