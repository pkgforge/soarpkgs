[pkg]
name        = "drally"
type        = "appimage"
description = "Open source game engine remake of Death Rally (1996)"
homepage    = ["https://github.com/urxp/dRally"]
license     = ["MIT"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["Game", "ArcadeGame", "ActionGame"]
repology    = ["drally"]
provides    = ["drally"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/dRally-AppImage"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/dRally-AppImage"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/urxp/dRally/master/LICENSE"
to  = "LICENSE"
verify = false
