[pkg]
name        = "bottom"
type        = "static"
description = "A customizable cross-platform graphical process/system monitor for the terminal"
src         = ["https://github.com/ClementTsang/bottom"]
homepage    = ["https://clementtsang.github.io/bottom"]
license     = ["MIT"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["ConsoleOnly", "Monitor", "System"]
repology    = ["bottom"]

[host]
supported = ["x86_64-linux", "aarch64-linux", "riscv64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge/builds"
tag-prefix = "bottom-"

[source]

[source.url]
x86_64-linux  = "https://github.com/ClementTsang/bottom/releases/download/${version}/bottom_${arch}-unknown-linux-musl.tar.gz"
aarch64-linux = "https://github.com/ClementTsang/bottom/releases/download/${version}/bottom_${arch}-unknown-linux-musl.tar.gz"
riscv64-linux = "https://github.com/pkgforge/builds/releases/download/bottom-${version}/bottom-${version}-riscv64-linux.tar.gz"

[source.install]
"btm"      = "bin/btm"
"btm.bash" = "share/bash-completion/completions/btm"
"btm.fish" = "share/fish/vendor_completions.d/btm.fish"
"_btm"     = "share/zsh/site-functions/_btm"

[source.install.riscv64-linux]
"btm"     = "bin/btm"
"LICENSE" = "LICENSE"

[[extra]]
url = "https://raw.githubusercontent.com/ClementTsang/bottom/main/LICENSE"
to  = "LICENSE"
verify = false
