[pkg]
name        = "flacon"
type        = "appimage"
description = "Extracts audio tracks from an audio CD image to separate files"
homepage    = ["https://flacon.github.io", "https://github.com/flacon/flacon"]
license     = ["LGPL-2.1"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["Audio", "Utility"]
repology    = ["flacon"]
provides    = ["flacon"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/Flacon-AppImage-Enhanced"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/Flacon-AppImage-Enhanced"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/flacon/flacon/master/LICENSE"
to  = "LICENSE"
verify = false
