[pkg]
name        = "bmherorecomp"
type        = "appimage"
description = "Static recompilation of Bomberman Hero for the Nintendo 64"
homepage    = ["https://github.com/RevoSucks/BMHeroRecomp"]
license     = ["GPL-3.0"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["Game", "ActionGame", "AdventureGame"]
provides    = ["bmherorecomp"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/BMHeroRecomp-AppImage-Enhanced"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/BMHeroRecomp-AppImage-Enhanced"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/RevoSucks/BMHeroRecomp/master/COPYING"
to  = "LICENSE"
