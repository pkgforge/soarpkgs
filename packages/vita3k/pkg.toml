[pkg]
name        = "vita3k"
type        = "appimage"
description = "Experimental PlayStation Vita emulator"
homepage    = ["https://vita3k.org", "https://github.com/Vita3K/Vita3K"]
license    = ["GPL-2.0"]
maintainer = ["QaidVoid (contact@qaidvoid.dev)"]
category   = ["Emulator", "Game"]
repology   = ["vita3k"]
channel    = "unstable"
note       = ["Needs PlayStation Vita firmware and game data, which are not shipped"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy = "html-regex"
repo     = "https://api.github.com/repos/Vita3K/Vita3K/releases/tags/continuous"
pattern  = "Corresponding commit: ([0-9a-f]{9})"

[source]
url = "https://github.com/Vita3K/Vita3K/releases/download/continuous/Vita3K-${arch}.AppImage"

[[extra]]
url = "https://raw.githubusercontent.com/Vita3K/Vita3K/master/COPYING.txt"
to  = "LICENSE"
verify = false
