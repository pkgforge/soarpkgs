[pkg]
name        = "touchhle"
type        = "appimage"
description = "High-level iOS emulator"
homepage    = ["https://github.com/touchHLE/touchHLE"]
license     = ["MPL-2.0"]
maintainer  = ["Samueru-sama (github.com/Samueru-sama)"]
category    = ["Emulator", "Game"]
repology    = ["touchhle"]
provides    = ["touchhle"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/TouchHLE-AppImage"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/TouchHLE-AppImage"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/touchHLE/touchHLE/refs/heads/trunk/LICENSE"
to  = "LICENSE"
verify = false
