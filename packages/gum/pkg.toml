[pkg]
name        = "gum"
type        = "static"
description = "A tool for glamorous shell scripts"
homepage    = ["https://github.com/charmbracelet/gum"]
license     = ["MIT"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["ConsoleOnly", "Development", "Utility"]
repology    = ["charm-gum"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[arch]
aarch64 = "arm64"
x86_64  = "x86_64"

[update]
strategy     = "github-releases"
repo         = "charmbracelet/gum"
strip-prefix = "v"

[source]
url     = "https://github.com/charmbracelet/gum/releases/download/v${version}/gum_${version}_Linux_${arch}.tar.gz"

[source.install]
"gum_${version}_Linux_${arch}/LICENSE"              = "LICENSE"
"gum_${version}_Linux_${arch}/gum"                  = "bin/gum"
"gum_${version}_Linux_${arch}/completions/gum.bash" = "share/bash-completion/completions/gum"
"gum_${version}_Linux_${arch}/completions/gum.fish" = "share/fish/vendor_completions.d/gum.fish"
"gum_${version}_Linux_x86_64/manpages/gum.1.gz"     = "share/man/man1/gum.1.gz"
"gum_${version}_Linux_${arch}/completions/gum.zsh"  = "share/zsh/site-functions/_gum"
