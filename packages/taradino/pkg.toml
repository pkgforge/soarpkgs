[pkg]
name        = "taradino"
type        = "appimage"
description = "SDL2 port of Rise of the Triad"
homepage    = ["https://github.com/fabiangreffrath/taradino"]
license     = ["GPL-2.0-or-later"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["Game", "ActionGame", "Shooter"]
repology    = ["taradino"]
provides    = ["taradino"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/Taradino-AppImage"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/Taradino-AppImage"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/fabiangreffrath/taradino/main/COPYING"
to  = "LICENSE"
verify = false
