[pkg]
name        = "aerofoil"
type        = "appimage"
description = "Modern port of Glider PRO, the classic Macintosh paper airplane game"
homepage    = ["https://github.com/elasota/Aerofoil"]
license     = ["GPL-2.0"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["Game"]
repology    = ["aerofoil"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/Aerofoil-AppImage"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/Aerofoil-AppImage"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/elasota/Aerofoil/refs/heads/master/LICENSE.txt"
to  = "LICENSE"
verify = false
