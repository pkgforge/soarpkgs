[pkg]
name        = "hyperfine"
type        = "static"
description = "A command-line benchmarking tool"
homepage    = ["https://github.com/sharkdp/hyperfine"]
license     = ["Apache-2.0", "MIT"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["ConsoleOnly", "Utility"]
repology    = ["hyperfine"]

[host]
supported = ["x86_64-linux"]

[update]
strategy     = "github-releases"
repo         = "sharkdp/hyperfine"
strip-prefix = "v"

[source]
url     = "https://github.com/sharkdp/hyperfine/releases/download/v${version}/hyperfine-v${version}-${arch}-unknown-linux-musl.tar.gz"

[source.install]
"hyperfine-v${version}-${arch}-unknown-linux-musl/LICENSE-APACHE"              = "LICENSE-APACHE"
"hyperfine-v${version}-${arch}-unknown-linux-musl/LICENSE-MIT"                 = "LICENSE-MIT"
"hyperfine-v${version}-${arch}-unknown-linux-musl/hyperfine"                   = "bin/hyperfine"
"hyperfine-v${version}-${arch}-unknown-linux-musl/autocomplete/hyperfine.bash" = "share/bash-completion/completions/hyperfine"
"hyperfine-v${version}-${arch}-unknown-linux-musl/autocomplete/hyperfine.fish" = "share/fish/vendor_completions.d/hyperfine.fish"
"hyperfine-v${version}-${arch}-unknown-linux-musl/hyperfine.1"                 = "share/man/man1/hyperfine.1"
"hyperfine-v${version}-${arch}-unknown-linux-musl/autocomplete/_hyperfine"     = "share/zsh/site-functions/_hyperfine"
