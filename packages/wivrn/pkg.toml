[pkg]
name        = "wivrn"
type        = "appimage"
description = "The Linux OpenXR streaming application to standalone headsets"
homepage    = ["https://github.com/WiVRn/WiVRn"]
license    = ["GPL-3.0-or-later"]
maintainer = ["QaidVoid (contact@qaidvoid.dev)"]
category   = ["Network"]
repology   = ["wivrn"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/WiVRn-AppImage"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/WiVRn-AppImage"
glob   = "*${arch}*.appimage"
