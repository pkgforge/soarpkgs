[pkg]
name        = "ffuf"
type        = "static"
description = "Fast web fuzzer written in Go"
homepage    = ["https://github.com/ffuf/ffuf"]
license     = ["MIT"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["ConsoleOnly", "Network", "Security"]
repology    = ["ffuf"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[arch]
aarch64 = "arm64"
x86_64  = "amd64"

[update]
strategy     = "github-releases"
repo         = "ffuf/ffuf"
strip-prefix = "v"

[source]
url     = "https://github.com/ffuf/ffuf/releases/download/v${version}/ffuf_${version}_linux_${arch}.tar.gz"

[source.install]
"LICENSE" = "LICENSE"
"ffuf"    = "bin/ffuf"
