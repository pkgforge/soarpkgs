[pkg]
name        = "ruff"
type        = "static"
description = "Extremely fast Python linter and code formatter, written in Rust"
homepage    = ["https://github.com/astral-sh/ruff"]
license     = ["MIT"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["ConsoleOnly", "Development", "Utility"]
repology    = ["ruff-python-linter"]
provides    = ["ruff"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy = "github-releases"
repo     = "astral-sh/ruff"

[source]
url     = "https://github.com/astral-sh/ruff/releases/download/${version}/ruff-${arch}-unknown-linux-musl.tar.gz"

[source.install]
"ruff-${arch}-unknown-linux-musl/ruff" = "ruff"

[[extra]]
url = "https://raw.githubusercontent.com/astral-sh/ruff/main/LICENSE"
to  = "LICENSE"
verify = false
