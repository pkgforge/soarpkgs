[pkg]
name        = "zoxide"
type        = "static"
description = "A smarter cd command, inspired by z and autojump"
homepage    = ["https://github.com/ajeetdsouza/zoxide"]
license     = ["MIT"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["ConsoleOnly", "Shell", "Utility"]
repology    = ["zoxide"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy     = "github-releases"
repo         = "ajeetdsouza/zoxide"
strip-prefix = "v"

[source]
url     = "https://github.com/ajeetdsouza/zoxide/releases/download/v${version}/zoxide-${version}-${arch}-unknown-linux-musl.tar.gz"

[source.install]
"LICENSE"              = "LICENSE"
"zoxide"               = "bin/zoxide"
"zoxide.bash"          = "share/bash-completion/completions/zoxide"
"zoxide.fish"          = "share/fish/vendor_completions.d/zoxide.fish"
"man1/zoxide-add.1"    = "share/man/man1/zoxide-add.1"
"man1/zoxide-import.1" = "share/man/man1/zoxide-import.1"
"man1/zoxide-init.1"   = "share/man/man1/zoxide-init.1"
"man1/zoxide-query.1"  = "share/man/man1/zoxide-query.1"
"man1/zoxide-remove.1" = "share/man/man1/zoxide-remove.1"
"man1/zoxide.1"        = "share/man/man1/zoxide.1"
"_zoxide"              = "share/zsh/site-functions/_zoxide"
