[pkg]
name        = "melt"
type        = "static"
description = "Backup and restore Ed25519 SSH keys with seed words"
homepage    = ["https://github.com/charmbracelet/melt"]
license     = ["MIT"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["ConsoleOnly", "Security", "Utility"]
repology    = ["melt"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[arch]
aarch64 = "arm64"
x86_64  = "x86_64"

[update]
strategy     = "github-releases"
repo         = "charmbracelet/melt"
strip-prefix = "v"

[source]
url     = "https://github.com/charmbracelet/melt/releases/download/v${version}/melt_${version}_Linux_${arch}.tar.gz"

[source.install]
"melt_${version}_Linux_${arch}/LICENSE.md"            = "LICENSE.md"
"melt_${version}_Linux_${arch}/melt"                  = "bin/melt"
"melt_${version}_Linux_${arch}/completions/melt.bash" = "share/bash-completion/completions/melt"
"melt_${version}_Linux_${arch}/completions/melt.fish" = "share/fish/vendor_completions.d/melt.fish"
"melt_${version}_Linux_x86_64/manpages/melt.1.gz"     = "share/man/man1/melt.1.gz"
"melt_${version}_Linux_${arch}/completions/melt.zsh"  = "share/zsh/site-functions/_melt"
