[pkg]
name        = "melt"
type        = "static"
description = "Backup and restore Ed25519 SSH keys with seed words"
homepage    = ["https://github.com/charmbracelet/melt"]
license     = ["MIT"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["ConsoleOnly", "Security", "Utility"]
repology    = ["melt"]
provides    = ["melt"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[arch]
aarch64 = "arm64"
x86_64  = "x86_64"

[update]
strategy     = "github-releases"
repo         = "charmbracelet/melt"
strip-prefix = "v"

[source]
url     = "https://github.com/charmbracelet/melt/releases/download/v${version}/melt_${version}_Linux_${arch}.tar.gz"

[source.install]
"melt_${version}_Linux_${arch}/melt" = "melt"
