[pkg]
name        = "algernon"
type        = "static"
description = "Small self-contained pure-Go web server with Lua, Teal, Markdown, HTTP/2, QUIC, Redis and PostgreSQL support"
homepage    = ["https://algernon.roboticoverlords.org"]
license     = ["BSD-3-Clause"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["Network", "WebDevelopment"]
repology    = ["algernon"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy     = "github-releases"
repo         = "xyproto/algernon"
strip-prefix = "v"

[source]
url     = "https://github.com/xyproto/algernon/releases/download/v${version}/algernon-${version}-linux_${arch}_static.tar.xz"

[source.install]
"*/LICENSE"                                             = "LICENSE"
"*/algernon"                                            = "bin/algernon"
"algernon-${version}-linux_x86_64_static/algernon.1.gz" = "share/man/man1/algernon.1.gz"
