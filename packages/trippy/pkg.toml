[pkg]
name        = "trippy"
type        = "static"
description = "A network diagnostic tool"
homepage    = ["https://trippy.cli.rs"]
license     = ["Apache-2.0"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["ConsoleOnly", "Network", "Utility"]
repology    = ["trippy"]
provides    = ["trip"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy = "github-releases"
repo     = "fujiapple852/trippy"

[source]
url     = "https://github.com/fujiapple852/trippy/releases/download/${version}/trippy-${version}-${arch}-unknown-linux-musl.tar.gz"

[source.install]
"trippy-${version}-${arch}-unknown-linux-musl/trip" = "trip"

[[extra]]
url = "https://raw.githubusercontent.com/fujiapple852/trippy/master/LICENSE"
to  = "LICENSE"
verify = false
