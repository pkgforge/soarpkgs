[pkg]
name        = "oxicord"
type        = "appimage"
description = "Vim-native Discord TUI for terminal enthusiasts"
homepage    = ["https://github.com/linuxmobile/oxicord"]
license     = ["GPL-3.0"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["Chat", "InstantMessaging", "Network"]
repology    = ["oxicord"]
provides    = ["oxicord"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/oxicord-appimage"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/oxicord-appimage"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/linuxmobile/oxicord/refs/heads/main/LICENSE"
to  = "LICENSE"
verify = false
