[pkg]
name        = "restic"
type        = "static"
description = "Fast, secure, efficient backup program"
homepage    = ["https://restic.net"]
license     = ["BSD-2-Clause"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["ConsoleOnly", "Archiving", "Utility"]
repology    = ["restic"]
provides    = ["restic"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[arch]
aarch64 = "arm64"
x86_64  = "amd64"

[update]
strategy     = "github-releases"
repo         = "restic/restic"
strip-prefix = "v"

[source]
url = "https://github.com/restic/restic/releases/download/v${version}/restic_${version}_linux_${arch}.bz2"

[source.install]
"restic" = "restic"

[[extra]]
url = "https://raw.githubusercontent.com/restic/restic/master/LICENSE"
to  = "LICENSE"
verify = false
