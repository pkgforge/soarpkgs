[pkg]
name        = "vegeta"
type        = "static"
description = "Versatile HTTP load testing tool"
homepage    = ["https://github.com/tsenart/vegeta"]
license     = ["MIT"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["ConsoleOnly", "Network", "Utility"]
repology    = ["vegeta"]
provides    = ["vegeta"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[arch]
aarch64 = "arm64"
x86_64  = "amd64"

[update]
strategy     = "github-releases"
repo         = "tsenart/vegeta"
strip-prefix = "v"

[source]
url     = "https://github.com/tsenart/vegeta/releases/download/v${version}/vegeta_${version}_linux_${arch}.tar.gz"

[source.install]
"vegeta" = "vegeta"

[[extra]]
url = "https://raw.githubusercontent.com/tsenart/vegeta/master/LICENSE"
to  = "LICENSE"
verify = false
