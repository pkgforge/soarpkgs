[pkg]
name        = "nerdctl"
type        = "static"
description = "Docker-compatible CLI for containerd"
homepage    = ["https://github.com/containerd/nerdctl"]
license     = ["Apache-2.0"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["ConsoleOnly", "System", "Utility"]
repology    = ["nerdctl"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[arch]
aarch64 = "arm64"
x86_64  = "amd64"

[update]
strategy     = "github-releases"
repo         = "containerd/nerdctl"
strip-prefix = "v"

[source]
url     = "https://github.com/containerd/nerdctl/releases/download/v${version}/nerdctl-${version}-linux-${arch}.tar.gz"

[source.install]
"nerdctl" = "bin/nerdctl"

[[extra]]
url = "https://raw.githubusercontent.com/containerd/nerdctl/main/LICENSE"
to  = "LICENSE"
verify = false
