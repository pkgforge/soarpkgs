[pkg]
name        = "gnome-text-editor"
type        = "appimage"
description = "Simple text editor for GNOME"
homepage    = [
  "https://gitlab.gnome.org/GNOME/gnome-text-editor",
  "https://github.com/pkgforge-dev/Gnome-Text-Editor-AppImage",
]
license    = ["GPL-3.0"]
maintainer = ["fiftydinar (github.com/fiftydinar)"]
category   = ["TextEditor", "Utility"]
repology   = ["gnome-text-editor"]
provides   = ["gnome-text-editor"]

[host]
supported = ["x86_64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/Gnome-Text-Editor-AppImage"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/Gnome-Text-Editor-AppImage"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/GNOME/gnome-text-editor/refs/heads/main/COPYING"
to  = "LICENSE"
