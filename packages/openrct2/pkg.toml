[pkg]
name        = "openrct2"
type        = "appimage"
description = "An open source re-implementation of RollerCoaster Tycoon 2"
homepage    = ["https://openrct2.io", "https://github.com/OpenRCT2/OpenRCT2"]
license     = ["GPL-3.0"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["Game", "Simulation", "StrategyGame"]
repology    = ["openrct2"]
provides    = ["openrct2"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/OpenRCT2-AppImage-Enhanced"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/OpenRCT2-AppImage-Enhanced"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/OpenRCT2/OpenRCT2/develop/licence.txt"
to  = "LICENSE"
