[pkg]
name        = "quantumlauncher"
type        = "appimage"
description = "A simple, powerful Minecraft launcher written in Rust"
homepage    = [
  "https://mrmayman.github.io/quantumlauncher",
  "https://github.com/Mrmayman/quantumlauncher",
]
license    = ["GPL-3.0"]
maintainer = ["QaidVoid (contact@qaidvoid.dev)"]
category   = ["Game", "Utility"]
repology   = ["quantumlauncher"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/QuantumLauncher-AppImage-Enhanced"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/QuantumLauncher-AppImage-Enhanced"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/Mrmayman/quantumlauncher/main/LICENSE"
to  = "LICENSE"
verify = false
