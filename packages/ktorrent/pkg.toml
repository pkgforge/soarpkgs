[pkg]
name        = "ktorrent"
type        = "appimage"
description = "Powerful BitTorrent client by KDE"
homepage    = ["https://apps.kde.org/ktorrent", "https://invent.kde.org/network/ktorrent"]
license     = ["GPL-2.0-or-later"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["Network", "FileTransfer", "P2P"]
repology    = ["ktorrent"]
provides    = ["ktorrent"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/KTorrent-AppImage"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/KTorrent-AppImage"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://invent.kde.org/network/ktorrent/-/raw/master/LICENSES/GPL-2.0-or-later.txt"
to  = "LICENSE"
verify = false
