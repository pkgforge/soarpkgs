[pkg]
name        = "dillo"
type        = "appimage"
description = "Lightweight multi-platform graphical web browser built on FLTK"
homepage    = ["https://dillo-browser.org", "https://github.com/dillo-browser/dillo"]
license     = ["GPL-3.0"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["Network", "WebBrowser"]
repology    = ["dillo"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/Dillo-AppImage"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/Dillo-AppImage"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/dillo-browser/dillo/master/COPYING"
to  = "LICENSE"
verify = false
