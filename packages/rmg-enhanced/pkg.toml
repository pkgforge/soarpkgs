[pkg]
name        = "rmg-enhanced"
type        = "appimage"
description = "Rosalie's Mupen GUI - N64 emulator frontend"
homepage    = ["https://github.com/Rosalie241/RMG"]
license     = ["GPL-3.0"]
maintainer  = ["Samueru-sama (github.com/Samueru-sama)"]
category    = ["Emulator", "Game"]
repology    = ["rmg-enhanced"]
provides    = ["rmg-enhanced"]

[host]
supported = ["x86_64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/RMG-AppImage-Enhanced"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/RMG-AppImage-Enhanced"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/Rosalie241/RMG/refs/heads/master/LICENSE"
to  = "LICENSE"
