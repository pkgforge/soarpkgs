[pkg]
name        = "nblood"
type        = "appimage"
description = "Source port of Blood based on the EDuke32/Build engine"
homepage    = ["https://github.com/nukeykt/NBlood"]
license     = ["GPL-2.0"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["Game", "ActionGame"]
repology    = ["nblood"]
provides    = ["nblood"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/NBlood-AppImage"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/NBlood-AppImage"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/nukeykt/NBlood/master/package/common/gpl-2.0.txt"
to  = "LICENSE"
