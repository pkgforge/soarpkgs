[pkg]
name        = "oha"
type        = "static"
description = "HTTP load generator, inspired by rakyll/hey with TUI animation"
homepage    = ["https://github.com/hatoo/oha"]
license     = ["MIT"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["ConsoleOnly", "Network", "Utility"]
repology    = ["oha"]
provides    = ["oha"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[arch]
aarch64 = "arm64"
x86_64  = "amd64"

[update]
strategy     = "github-releases"
repo         = "hatoo/oha"
strip-prefix = "v"

[source]
url = "https://github.com/hatoo/oha/releases/download/v${version}/oha-linux-${arch}"

[source.install]
"oha" = "oha"

[[extra]]
url = "https://raw.githubusercontent.com/hatoo/oha/master/LICENSE"
to  = "LICENSE"
