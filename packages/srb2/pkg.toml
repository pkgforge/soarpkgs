[pkg]
name        = "srb2"
type        = "appimage"
description = "A 3D Sonic the Hedgehog fan game based off of the Doom Legacy engine"
homepage    = ["https://www.srb2.org", "https://github.com/STJr/SRB2"]
license     = ["GPL-2.0"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["Game", "ArcadeGame", "ActionGame"]
repology    = ["srb2"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/SRB2-AppImage"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/SRB2-AppImage"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/STJr/SRB2/master/LICENSE"
to  = "LICENSE"
verify = false
