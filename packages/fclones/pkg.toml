[pkg]
name        = "fclones"
type        = "static"
description = "Efficient duplicate file finder"
homepage    = ["https://github.com/pkolaczk/fclones"]
license     = ["MIT"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["ConsoleOnly", "FileTools", "Utility"]
repology    = ["fclones"]
provides    = ["fclones"]

[host]
supported = ["x86_64-linux"]

[update]
strategy     = "github-releases"
repo         = "pkolaczk/fclones"
strip-prefix = "v"

[source]
url     = "https://github.com/pkolaczk/fclones/releases/download/v${version}/fclones-${version}-linux-musl-${arch}.tar.gz"

[source.install]
"target/${arch}-unknown-linux-musl/release/fclones" = "fclones"

[[extra]]
url = "https://raw.githubusercontent.com/pkolaczk/fclones/master/LICENSE"
to  = "LICENSE"
