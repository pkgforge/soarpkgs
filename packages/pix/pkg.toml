[pkg]
name        = "pix"
type        = "appimage"
description = "Image viewer and browser based on gThumb"
homepage    = ["https://github.com/linuxmint/pix"]
license     = ["GPL-2.0-or-later"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["Graphics", "Viewer"]
repology    = ["pix"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/Pix-AppImage"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/Pix-AppImage"
glob   = "*${arch}*.appimage"
