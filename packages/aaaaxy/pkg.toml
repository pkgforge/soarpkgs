[pkg]
name        = "aaaaxy"
type        = "appimage"
description = "Nonlinear 2D puzzle platformer taking place in impossible spaces"
homepage    = [
  "https://divVerent.github.io/aaaaxy",
  "https://github.com/divVerent/aaaaxy",
]
license    = ["Apache-2.0"]
maintainer = ["QaidVoid (contact@qaidvoid.dev)"]
category   = ["ActionGame", "Game"]
repology   = ["aaaaxy"]
provides   = ["aaaaxy"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/AAAAXY-AppImage-Enhanced"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/AAAAXY-AppImage-Enhanced"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/divVerent/aaaaxy/refs/heads/main/LICENSE"
to  = "LICENSE"
verify = false
