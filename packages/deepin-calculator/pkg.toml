[pkg]
name        = "deepin-calculator"
type        = "appimage"
description = "Calculator for the Deepin desktop"
homepage    = ["https://github.com/linuxdeepin/deepin-calculator"]
license     = ["GPL-3.0"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["Calculator", "Utility"]
repology    = ["deepin-calculator"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/Deepin-Calculator-AppImage"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/Deepin-Calculator-AppImage"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/linuxdeepin/deepin-calculator/master/LICENSE"
to  = "LICENSE"
verify = false
