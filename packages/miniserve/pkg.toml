[pkg]
name        = "miniserve"
type        = "static"
description = "CLI tool to serve files and dirs over HTTP"
src         = ["https://github.com/svenstaro/miniserve"]
homepage    = ["https://github.com/svenstaro/miniserve"]
license     = ["MIT"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["ConsoleOnly", "Network", "Utility"]
repology    = ["miniserve"]

[host]
supported = ["x86_64-linux", "aarch64-linux", "riscv64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge/builds"
tag-prefix = "miniserve-"

[source]

[source.url]
x86_64-linux  = "https://github.com/svenstaro/miniserve/releases/download/v${version}/miniserve-${version}-${arch}-unknown-linux-musl"
aarch64-linux = "https://github.com/svenstaro/miniserve/releases/download/v${version}/miniserve-${version}-${arch}-unknown-linux-musl"
riscv64-linux = "https://github.com/pkgforge/builds/releases/download/miniserve-${version}/miniserve-${version}-riscv64-linux.tar.gz"

[[extra]]
url = "https://raw.githubusercontent.com/svenstaro/miniserve/master/LICENSE"
to  = "LICENSE"
verify = false

[source.install.riscv64-linux]
"miniserve" = "bin/miniserve"
"LICENSE"   = "LICENSE"
