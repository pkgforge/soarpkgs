[pkg]
name        = "gitui"
type        = "static"
description = "Blazing fast terminal-ui for git written in Rust"
homepage    = ["https://github.com/extrawurst/gitui"]
license     = ["MIT"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["ConsoleOnly", "RevisionControl", "Development"]
repology    = ["gitui"]
provides    = ["gitui"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy     = "github-releases"
repo         = "extrawurst/gitui"
strip-prefix = "v"

[source]
url     = "https://github.com/extrawurst/gitui/releases/download/v${version}/gitui-linux-${arch}.tar.gz"

[source.install]
"gitui" = "gitui"

[[extra]]
url = "https://raw.githubusercontent.com/extrawurst/gitui/master/LICENSE.md"
to  = "LICENSE"
verify = false
