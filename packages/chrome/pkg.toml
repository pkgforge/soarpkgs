[pkg]
name        = "chrome"
type        = "appimage"
description = "Google Chrome web browser"
homepage    = [
  "https://www.google.com/chrome",
  "https://github.com/pkgforge-dev/Chrome-Appimage",
]
license    = ["Proprietary"]
maintainer = ["QaidVoid (contact@qaidvoid.dev)"]
category   = ["Network", "WebBrowser"]
repology   = ["google-chrome"]
note       = ["Terms of service: https://www.google.com/chrome/terms"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/Chrome-Appimage"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/Chrome-Appimage"
glob   = "*${arch}*.appimage"
