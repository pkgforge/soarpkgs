[pkg]
name        = "pcsx2"
type        = "appimage"
description = "Free and open-source PlayStation 2 emulator"
homepage    = ["https://pcsx2.net"]
license     = ["GPL-3.0"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["Emulator", "Game"]
repology    = ["pcsx2"]
provides    = ["pcsx2"]

[host]
supported = ["x86_64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/PCSX2-AppImage-Enhanced"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/PCSX2-AppImage-Enhanced"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/PCSX2/pcsx2/refs/heads/master/COPYING.GPLv3"
to  = "LICENSE"
