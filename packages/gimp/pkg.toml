[pkg]
name        = "gimp"
type        = "appimage"
description = "GNU Image Manipulation Program"
homepage    = [
  "https://www.gimp.org",
  "https://github.com/pkgforge-dev/GIMP-and-PhotoGIMP-AppImage",
]
license    = ["GPL-3.0"]
maintainer = ["Samueru-sama (github.com/Samueru-sama)"]
category   = ["Graphics", "ImageProcessing", "RasterGraphics"]
repology   = ["gimp"]
provides   = ["gimp"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/GIMP-and-PhotoGIMP-AppImage"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/GIMP-and-PhotoGIMP-AppImage"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://gitlab.gnome.org/GNOME/gimp/-/raw/master/COPYING"
to  = "LICENSE"
verify = false
