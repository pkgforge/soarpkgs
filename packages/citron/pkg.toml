[pkg]
name        = "citron"
type        = "appimage"
description = "Nintendo switch emulator"
homepage    = ["https://github.com/emuplace/Citron"]
license     = ["GPL-3.0"]
maintainer  = ["Samueru-sama (github.com/Samueru-sama)"]
category    = ["Emulator", "Game"]
repology    = ["citron"]
provides    = ["citron"]

disabled        = true
disabled-reason = "upstream repo DMCA-blocked (github/dmca 2026-02-12, Nintendo)"

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/Citron-AppImage"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/Citron-AppImage"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://git.citron-emu.org/Citron/Citron/LICENSE"
to  = "LICENSE"
