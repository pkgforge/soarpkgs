[pkg]
name        = "catacombgl"
type        = "appimage"
description = "Source port with OpenGL graphics for the Catacomb 3-D game series"
homepage    = ["https://github.com/ArnoAnsems/CatacombGL"]
license     = ["GPL-3.0"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["Game", "ActionGame"]
repology    = ["catacombgl"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/CatacombGL-AppImage"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/CatacombGL-AppImage"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/ArnoAnsems/CatacombGL/master/LICENSE"
to  = "LICENSE"
verify = false
