[pkg]
name        = "eza"
type        = "static"
description = "A modern replacement for ls"
homepage    = ["https://eza.rocks"]
license     = ["MIT"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["ConsoleOnly", "FileTools", "Utility"]
repology    = ["eza"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge/builds"
# one repository publishes for several packages, so tags are filtered
tag-prefix = "eza-"

[source]
github = "pkgforge/builds"
glob   = "eza-${version}-${arch}-linux.tar.gz"
