[pkg]
name        = "nnn"
type        = "static"
description = "n³ The unorthodox terminal file manager"
homepage    = ["https://github.com/jarun/nnn"]
license     = ["BSD-2-Clause"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["ConsoleOnly", "FileManager", "Utility"]
repology    = ["nnn"]
provides    = ["nnn"]

[host]
supported = ["x86_64-linux"]

[update]
strategy     = "github-releases"
repo         = "jarun/nnn"
strip-prefix = "v"

[source]
url     = "https://github.com/jarun/nnn/releases/download/v${version}/nnn-musl-static-${version}.${arch}.tar.gz"

[source.install]
"nnn-musl-static" = "nnn"

[[extra]]
url = "https://raw.githubusercontent.com/jarun/nnn/master/LICENSE"
to  = "LICENSE"
