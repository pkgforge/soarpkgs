[pkg]
name        = "mise"
type        = "static"
description = "The front-end to your dev env"
homepage    = ["https://mise.jdx.dev"]
license     = ["MIT"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["Development", "Utility"]
repology    = ["mise"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[arch]
aarch64 = "arm64"
x86_64  = "x64"

[update]
strategy     = "github-releases"
repo         = "jdx/mise"
strip-prefix = "v"

[source]
github  = "jdx/mise"
glob    = "*linux-${arch}-musl.tar.xz"

[source.install]
"mise/LICENSE"                                     = "LICENSE"
"mise/bin/mise"                                    = "bin/mise"
"mise/share/fish/vendor_conf.d/mise-activate.fish" = "share/fish/vendor_completions.d/mise-activate.fish"
"mise/man/man1/mise.1"                             = "share/man/man1/mise.1"
