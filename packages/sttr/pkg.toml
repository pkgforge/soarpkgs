[pkg]
name        = "sttr"
type        = "static"
description = "CLI app to perform various operations on strings"
homepage    = ["https://github.com/abhimanyu003/sttr"]
license     = ["MIT"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["ConsoleOnly", "Development", "Utility"]
repology    = ["sttr"]
provides    = ["sttr"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[arch]
aarch64 = "arm64"
x86_64  = "x86_64"

[update]
strategy     = "github-releases"
repo         = "abhimanyu003/sttr"
strip-prefix = "v"

[source]
url     = "https://github.com/abhimanyu003/sttr/releases/download/v${version}/sttr_Linux_${arch}.tar.gz"

[source.install]
"sttr"    = "sttr"
"LICENSE" = "LICENSE"
