[pkg]
name        = "namida"
type        = "appimage"
description = "Music and video player with YouTube support, built with Flutter"
homepage    = ["https://github.com/namidaco/namida"]
license     = ["Proprietary"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["Audio", "Music", "Player"]
repology    = ["namida"]

[host]
supported = ["x86_64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/Namida-AppImage"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/Namida-AppImage"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/namidaco/namida/main/LICENSE"
to  = "LICENSE"
verify = false
