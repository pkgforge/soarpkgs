[pkg]
name        = "dingusppc"
type        = "appimage"
description = "Emulator for PowerPC Macintosh systems"
homepage    = [
  "https://github.com/dingusdev/dingusppc",
  "https://github.com/pkgforge-dev/DingusPPC-AppImage",
]
license    = ["GPL-3.0"]
maintainer = ["QaidVoid (contact@qaidvoid.dev)"]
category   = ["Emulator", "System"]
repology   = ["dingusppc"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/DingusPPC-AppImage"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/DingusPPC-AppImage"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/dingusdev/dingusppc/refs/heads/master/LICENSE"
to  = "LICENSE"
verify = false
