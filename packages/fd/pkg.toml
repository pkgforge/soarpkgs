[pkg]
name        = "fd"
type        = "static"
description = "A simple, fast and user-friendly alternative to find"
homepage    = ["https://github.com/sharkdp/fd"]
license     = ["Apache-2.0", "MIT"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["ConsoleOnly", "FileTools", "Utility"]
repology    = ["fd-find"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy     = "github-releases"
repo         = "sharkdp/fd"
strip-prefix = "v"

[source]
url     = "https://github.com/sharkdp/fd/releases/download/v${version}/fd-v${version}-${arch}-unknown-linux-musl.tar.gz"

[source.install]
"fd-v${version}-${arch}-unknown-linux-musl/LICENSE-APACHE"       = "LICENSE-APACHE"
"fd-v${version}-${arch}-unknown-linux-musl/LICENSE-MIT"          = "LICENSE-MIT"
"fd-v${version}-${arch}-unknown-linux-musl/fd"                   = "bin/fd"
"fd-v${version}-${arch}-unknown-linux-musl/autocomplete/fd.bash" = "share/bash-completion/completions/fd"
"fd-v${version}-${arch}-unknown-linux-musl/autocomplete/fd.fish" = "share/fish/vendor_completions.d/fd.fish"
"fd-v${version}-${arch}-unknown-linux-musl/fd.1"                 = "share/man/man1/fd.1"
"fd-v${version}-${arch}-unknown-linux-musl/autocomplete/_fd"     = "share/zsh/site-functions/_fd"
