[pkg]
name        = "starfox64recomp"
type        = "appimage"
description = "Static recompilation of the Nintendo 64 game Star Fox 64"
homepage    = []
license     = ["GPL-3.0-only"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["Game", "ActionGame", "Shooter"]
repology    = ["starfox64recomp"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/Starfox64Recomp-AppImage"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/Starfox64Recomp-AppImage"
glob   = "*${arch}*.appimage"
