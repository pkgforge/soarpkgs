[pkg]
name        = "fselect"
type        = "static"
description = "Find files with SQL-like queries"
homepage    = ["https://github.com/jhspetersson/fselect"]
license     = ["Apache-2.0", "MIT"]
maintainer  = ["QaidVoid (contact@qaidvoid.dev)"]
category    = ["ConsoleOnly", "FileTools", "Utility"]
repology    = ["fselect"]

[host]
supported = ["x86_64-linux"]

[update]
strategy = "github-releases"
repo     = "jhspetersson/fselect"

[source]
url = "https://github.com/jhspetersson/fselect/releases/download/${version}/fselect-${arch}-linux-musl.gz"

[source.install]
"fselect" = "bin/fselect"

[[extra]]
url = "https://raw.githubusercontent.com/jhspetersson/fselect/master/LICENSE-MIT"
to  = "LICENSE"
verify = false
