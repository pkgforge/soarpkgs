[pkg]
name        = "extension-manager"
type        = "appimage"
description = "Manage GNOME Shell extensions"
homepage    = ["https://github.com/mjakeman/extension-manager"]
license     = ["GPL-3.0"]
maintainer  = ["Shikakiben (github.com/Shikakiben)"]
category    = ["GNOME", "Settings", "Utility"]
repology    = ["extension-manager"]
provides    = ["extension-manager"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/Extension-Manager-AppImage"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/Extension-Manager-AppImage"
glob   = "*${arch}*.appimage"

[[extra]]
url = "https://raw.githubusercontent.com/mjakeman/extension-manager/refs/heads/master/COPYING"
to  = "LICENSE"
verify = false
