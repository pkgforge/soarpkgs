[pkg]
name        = "gcap2026"
type        = "appimage"
description = "Brazilian Federal Revenue capital gains tax program GCAP 2026"
homepage    = [
  "https://www.gov.br/receitafederal/pt-br/centrais-de-conteudo/download/pgd/gcap",
]
license    = ["Proprietary"]
maintainer = ["QaidVoid (contact@qaidvoid.dev)"]
category   = ["Office", "Finance"]
provides   = ["gcap2026"]

[host]
supported = ["x86_64-linux", "aarch64-linux"]

[update]
strategy   = "github-releases"
repo       = "pkgforge-dev/GCAP2026-AppImage"
tag-suffix = "strip"

[source]
github = "pkgforge-dev/GCAP2026-AppImage"
glob   = "*${arch}*.appimage"
